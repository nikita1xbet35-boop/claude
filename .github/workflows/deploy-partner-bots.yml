name: Deploy partner-bots worker

# Зачем этот воркфлоу существует
#
# Корневой воркер (дашборд) Cloudflare пересобирает сам при пуше в main — у
# него настроена Git-интеграция. Для partner-bots такого пути нет: Workers
# Builds собирает один воркер из корня репозитория, а не каждую подпапку.
# Значит без этого файла деплой бота — только руками через wrangler, а именно
# ручные операции в Cloudflare и оказались узким местом.
#
# Что нужно один раз завести в GitHub → Settings → Secrets and variables →
# Actions → New repository secret:
#
#   CLOUDFLARE_API_TOKEN   обязателен. Cloudflare → My Profile → API Tokens →
#                          Create Token → шаблон "Edit Cloudflare Workers".
#   CLOUDFLARE_ACCOUNT_ID  обязателен. Виден в адресе панели:
#                          dash.cloudflare.com/<ЭТО_ОН>/workers
#
# Дальше — по желанию. Если положить сюда токены ботов, воркфлоу сам зальёт их
# в секреты Cloudflare, и в панель Cloudflare заходить не придётся вообще:
#
#   BOT_TOKEN_INDIA, BOT_TOKEN_AFRICA, BOT_TOKEN_BANGLADESH,
#   BOT_TOKEN_WORLDWIDE, BOT_TOKEN_AFRIQUE, BOT_TOKEN_UZBEKISTAN,
#   BOT_TOKEN_RU, BOT_TOKEN_LATAM,
#   BOT_WEBHOOK_SECRET, SUPABASE_SERVICE_KEY
#
# SUPABASE_URL в этом списке нет намеренно: он не секрет и объявлен в
# wrangler.jsonc как обычная переменная.
#
# Незаданные пропускаются с предупреждением, а не роняют деплой: воркер должен
# выкатываться и тогда, когда часть ботов ещё не заведена.

on:
  push:
    branches: [main]
    paths:
      - 'partner-bots/**'
      - '.github/workflows/deploy-partner-bots.yml'
  workflow_dispatch:

# Два деплоя одновременно — реальный риск, а не теория: за последний час
# прогоны запускались один за другим с интервалом в минуты. Этот воркфлоу не
# только собирает воркер, он ещё заливает секреты и перерегистрирует вебхуки,
# и наложение двух таких прогонов даёт состояние, которое потом не прочитаешь:
# секреты от одного, код от другого, вебхуки указывают неизвестно на что.
#
# cancel-in-progress намеренно false. Отменять деплой посередине — значит
# оставить часть секретов залитой, а воркер старым; очередь безопаснее, тем
# более что весь прогон занимает меньше минуты.
concurrency:
  group: deploy-partner-bots
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Тесты до деплоя, а не после. Сеть в них подменена целиком, внешних
      # зависимостей нет — то есть это дешёвая проверка, которая не пускает в
      # прод воркер, ломающий выдачу ссылок или дублирующий лиды.
      - name: Тесты
        run: node partner-bots/test.mjs

      # Печатает картину целиком, а не падает на первом отсутствующем.
      #
      # Причина конкретная: два прогона подряд сообщали, что CLOUDFLARE_* не
      # заданы, при том что на странице настроек репозитория они видны. Из
      # «упало на первом» нельзя понять, доезжает ли хоть что-нибудь — а это
      # ровно та развилка, которая нужна: пусто ВСЁ (секреты не на вкладке
      # Actions или не в этом репозитории) или пусто только старое.
      #
      # Значения не печатаются никогда, только факт наличия. GitHub маскирует
      # заданные секреты как ***, но полагаться на маскировку там, где можно
      # просто не печатать, незачем.
      - name: Какие секреты дошли до Actions
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOT_TOKEN_INDIA: ${{ secrets.BOT_TOKEN_INDIA }}
          BOT_TOKEN_AFRICA: ${{ secrets.BOT_TOKEN_AFRICA }}
          BOT_TOKEN_BANGLADESH: ${{ secrets.BOT_TOKEN_BANGLADESH }}
          BOT_TOKEN_WORLDWIDE: ${{ secrets.BOT_TOKEN_WORLDWIDE }}
          BOT_TOKEN_AFRIQUE: ${{ secrets.BOT_TOKEN_AFRIQUE }}
          BOT_TOKEN_UZBEKISTAN: ${{ secrets.BOT_TOKEN_UZBEKISTAN }}
          BOT_TOKEN_RU: ${{ secrets.BOT_TOKEN_RU }}
          BOT_TOKEN_LATAM: ${{ secrets.BOT_TOKEN_LATAM }}
          BOT_WEBHOOK_SECRET: ${{ secrets.BOT_WEBHOOK_SECRET }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -u
          have=0; miss=0
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID \
                      BOT_TOKEN_INDIA BOT_TOKEN_AFRICA BOT_TOKEN_BANGLADESH \
                      BOT_TOKEN_WORLDWIDE BOT_TOKEN_AFRIQUE BOT_TOKEN_UZBEKISTAN \
                      BOT_TOKEN_RU BOT_TOKEN_LATAM \
                      BOT_WEBHOOK_SECRET SUPABASE_SERVICE_KEY; do
            if [ -n "${!name:-}" ]; then echo "  есть    $name"; have=$((have+1))
            else                         echo "  НЕТ     $name"; miss=$((miss+1)); fi
          done
          echo "итого: дошло $have, отсутствует $miss"

          if [ "$have" -eq 0 ]; then
            echo "::error::до Actions не дошёл НИ ОДИН секрет. Значит они заведены не там:"
            echo "::error::на странице Secrets and variables три вкладки — Actions, Dependabot, Codespaces."
            echo "::error::Нужна вкладка Actions: /settings/secrets/actions"
            exit 1
          fi
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::часть секретов дошла, а CLOUDFLARE_* нет — значит эти два лежат"
            echo "::error::на другой вкладке (или в другом репозитории). Заведи их заново"
            echo "::error::на вкладке Actions: /settings/secrets/actions"
            exit 1
          fi

          # SUPABASE_SERVICE_KEY обязателен, а не «пропустим с предупреждением».
          #
          # Без него воркер задеплоится и вебхуки зарегистрируются, но любой
          # апдейт упрётся в 401 на первом же запросе за конфигом бота.
          # Обработчик поймает ошибку и вернёт Telegram 200 — иначе Telegram
          # завалит нас повторами, — то есть снаружи бот просто молчит, и ни
          # одной ошибки не видно. Выкатить такое хуже, чем не выкатить.
          #
          # Вход в Supabase через GitHub этого не заменяет: он авторизует
          # человека в браузере, а воркер — серверный процесс, у него нет ни
          # браузера, ни сессии. Ему нужен ключ в заголовке запроса.
          if [ -z "${SUPABASE_SERVICE_KEY:-}" ]; then
            echo "::error::нет SUPABASE_SERVICE_KEY — бот задеплоится, но будет молчать:"
            echo "::error::все запросы к базе вернут 401, а Telegram будет получать 200."
            echo "::error::Взять: Supabase → Settings → API → ключ service_role."
            echo "::error::Вход в Supabase через GitHub это НЕ заменяет — он про браузер, а не про воркер."
            exit 1
          fi

      - name: Установить wrangler
        run: npm install -g wrangler@3

      # Секреты заливаются ДО деплоя: воркер, поднявшийся без токена бота,
      # отвечал бы 500 на каждый апдейт, и Telegram успел бы накопить очередь
      # повторов за те секунды, пока секрет доезжает.
      - name: Синхронизировать секреты Cloudflare
        working-directory: partner-bots
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BOT_TOKEN_INDIA: ${{ secrets.BOT_TOKEN_INDIA }}
          BOT_TOKEN_AFRICA: ${{ secrets.BOT_TOKEN_AFRICA }}
          BOT_TOKEN_BANGLADESH: ${{ secrets.BOT_TOKEN_BANGLADESH }}
          BOT_TOKEN_WORLDWIDE: ${{ secrets.BOT_TOKEN_WORLDWIDE }}
          BOT_TOKEN_AFRIQUE: ${{ secrets.BOT_TOKEN_AFRIQUE }}
          BOT_TOKEN_UZBEKISTAN: ${{ secrets.BOT_TOKEN_UZBEKISTAN }}
          BOT_TOKEN_RU: ${{ secrets.BOT_TOKEN_RU }}
          BOT_TOKEN_LATAM: ${{ secrets.BOT_TOKEN_LATAM }}
          BOT_WEBHOOK_SECRET: ${{ secrets.BOT_WEBHOOK_SECRET }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          set -u
          skipped=""
          for name in BOT_TOKEN_INDIA BOT_TOKEN_AFRICA BOT_TOKEN_BANGLADESH \
                      BOT_TOKEN_WORLDWIDE BOT_TOKEN_AFRIQUE BOT_TOKEN_UZBEKISTAN \
                      BOT_TOKEN_RU BOT_TOKEN_LATAM \
                      BOT_WEBHOOK_SECRET SUPABASE_SERVICE_KEY; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              skipped="$skipped $name"
              continue
            fi
            # printf, а не echo: echo в некоторых оболочках добавляет перевод
            # строки в значение, и секрет перестаёт совпадать при сравнении —
            # ровно та поломка, что уже была с AUTH_* на соседнем воркере.
            printf '%s' "$value" | wrangler secret put "$name" >/dev/null
            echo "  залит $name"
          done
          [ -n "$skipped" ] && echo "::warning::пропущены (не заданы в GitHub):$skipped"
          exit 0

      - name: Деплой
        id: deploy
        working-directory: partner-bots
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # pipefail обязателен: без него падение wrangler заслонит успешный
          # tee, и job поедет дальше как ни в чём не бывало.
          set -o pipefail
          wrangler deploy 2>&1 | tee deploy.log

          # Адрес не собирается из имени воркера: поддомен свой у каждого
          # аккаунта, и угаданный адрес выглядел бы правдоподобно, а вебхуки
          # уехали бы в никуда. Берём тот, что назвал сам wrangler.
          url=$(grep -oE 'https://[A-Za-z0-9._-]+\.workers\.dev' deploy.log | head -1)
          if [ -z "$url" ]; then
            echo "::error::не удалось вычитать адрес воркера из вывода wrangler"
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "воркер: $url"

      # Самопроверка воркера ПОСЛЕ деплоя, но ДО вебхуков.
      #
      # Обработчик апдейта возвращает Telegram 200 на любой своей ошибке —
      # иначе Telegram завалит повторами. Плата за это: снаружи любая поломка
      # выглядит как «бот молчит», и зелёный деплой ничего не доказывает.
      # Именно так и вышло: оба конвейера были зелёными, а боты не отвечали.
      # Этот шаг делает те же обращения к базе открыто и печатает текст ошибки.
      - name: Проверить, что воркер видит базу
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -u
          # Первый запрос может прийти раньше, чем новая версия разъедется по
          # краю сети, поэтому три попытки, а не одна.
          for i in 1 2 3; do
            body=$(curl -sS --max-time 25 "${WORKER_URL%/}/health") && break
            echo "попытка $i не удалась, повтор через 5с"; sleep 5
          done
          echo "$body"
          echo "$body" | grep -q '"ok": true' || {
            echo "::error::воркер задеплоен, но не работает — см. поля с ОШИБКА выше"
            exit 1
          }

      # Сквозной прогон каждой функции на ЖИВОМ воркере, все восемь ботов.
      #
      # Это то, чего не хватало всё время. Тесты гоняют код локально, /health
      # проверяет доступ к базе — и обе проверки были зелёными, пока /start в
      # проде не отвечал вообще. Ни одна из них не трогала путь «пришёл апдейт
      # → бот ответил», а ломался именно он.
      #
      # Здесь дёргается настоящий обработчик задеплоенного воркера, и ответ
      # сверяется по содержанию: приветствие, четыре кнопки, ссылка регистрации,
      # статус страны из справочника. Красный шаг = бот не работает, и это
      # видно ДО того, как об этом скажет человек.
      - name: Прогнать все функции на живом воркере
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
          SECRET: ${{ secrets.BOT_WEBHOOK_SECRET }}
        run: |
          set -u
          bad=0
          # call <slug> <json-тело> → тело ответа в $RESP
          call() {
            RESP=$(curl -sS --max-time 25 -X POST \
              -H "X-Telegram-Bot-Api-Secret-Token: $SECRET" \
              -H 'Content-Type: application/json' \
              -d "$2" "${WORKER_URL%/}/selftest/$1")
          }
          # expect <ярлык> <регулярка>
          expect() {
            if printf '%s' "$RESP" | grep -qE "$2"; then
              echo "    ok   $1"
            else
              echo "    FAIL $1"
              printf '%s\n' "$RESP" | head -30 | sed 's/^/         /'
              bad=1
            fi
          }

          for slug in india africa bangladesh worldwide afrique uzbekistan ru latam; do
            echo "  ── $slug ──"
            call "$slug" '{"text":"/start"}'
            expect "/start отвечает"        '"ok": true'
            expect "меню из четырёх кнопок"  'Check GEO|Vérifier un GEO|GEO tekshirish|Проверить ГЕО|Consultar GEO'

            call "$slug" '{"text":"/check_geo"}'
            expect "Check GEO открывается"   '"ok": true'

            call "$slug" '{"callback_data":"geo:country"}'
            expect "просит название страны"  '"ok": true'

            call "$slug" '{"text":"Nigeria"}'
            expect "Nigeria → статус"        'Nigeria'

            call "$slug" '{"callback_data":"faq:payouts"}'
            expect "FAQ отвечает текстом"    'Tuesday|mardis|seshanba|вторник|martes'
          done

          # Выдачу ссылки проверяем на одном боте: она одна на все шесть, а
          # каждый прогон пишет строку в bot_leads.
          call india '{"text":"🔗 Get Registration Link"}'
          expect "ссылка регистрации выдаётся" '1xaffiliate\.org/newreg'

          [ "$bad" = 0 ] || { echo "::error::боты задеплоены, но не работают — см. FAIL выше"; exit 1; }
          echo "  все функции отвечают на всех восьми ботах"

      # Что Telegram видел ДО этого деплоя.
      #
      # Печатается перед перерегистрацией, потому что setWebhook обнуляет
      # счётчики: после него мы всегда увидим чистую картину и ничего не
      # узнаем. Здесь же видно настоящую историю — сколько апдейтов зависло в
      # очереди и с какой ошибкой Telegram не смог их доставить. Это
      # единственный взгляд с ТОЙ стороны; наш воркер на любой своей ошибке
      # отвечает 200 и в статистике Telegram выглядит здоровым.
      - name: Что Telegram видел до деплоя
        env:
          BOT_TOKEN_INDIA: ${{ secrets.BOT_TOKEN_INDIA }}
          BOT_TOKEN_AFRICA: ${{ secrets.BOT_TOKEN_AFRICA }}
          BOT_TOKEN_BANGLADESH: ${{ secrets.BOT_TOKEN_BANGLADESH }}
          BOT_TOKEN_WORLDWIDE: ${{ secrets.BOT_TOKEN_WORLDWIDE }}
          BOT_TOKEN_AFRIQUE: ${{ secrets.BOT_TOKEN_AFRIQUE }}
          BOT_TOKEN_UZBEKISTAN: ${{ secrets.BOT_TOKEN_UZBEKISTAN }}
          BOT_TOKEN_RU: ${{ secrets.BOT_TOKEN_RU }}
          BOT_TOKEN_LATAM: ${{ secrets.BOT_TOKEN_LATAM }}
        run: |
          set -u
          for slug in india africa bangladesh worldwide afrique uzbekistan ru latam; do
            var="BOT_TOKEN_$(echo "$slug" | tr '[:lower:]' '[:upper:]')"
            info=$(curl -sS --max-time 20 "https://api.telegram.org/bot${!var}/getWebhookInfo" || true)
            pend=$(echo "$info" | grep -oE '"pending_update_count":[0-9]+' | cut -d: -f2)
            err=$(echo "$info"  | grep -oE '"last_error_message":"[^"]*"' || true)
            printf '  %-11s в очереди: %-4s %s\n' "$slug" "${pend:-?}" "${err:-}"
          done

      # Проверяем, что статика воркера действительно отдаётся: PDF полного
      # списка ГЕО лежит в public/ и уходит человеку по кнопке. Файл, который
      # не отдаётся, снаружи выглядит как «кнопка не работает».
      - name: Проверить, что PDF отдаётся
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -u
          code=$(curl -sS -o /tmp/geo.pdf -w '%{http_code}' --max-time 25 "${WORKER_URL%/}/geo.pdf")
          size=$(stat -c%s /tmp/geo.pdf 2>/dev/null || echo 0)
          head -c 4 /tmp/geo.pdf | grep -q '%PDF' && magic=ok || magic=НЕТ
          echo "  /geo.pdf → HTTP $code, ${size} байт, сигнатура PDF: $magic"
          [ "$code" = "200" ] && [ "$magic" = "ok" ] || {
            echo "::error::PDF не отдаётся — кнопка «Full GEO list» пришлёт битый файл"
            exit 1
          }

      # Регистрация вебхуков здесь, а не руками на машине Ника: только у
      # раннера есть одновременно и токены (из секретов), и выход в
      # api.telegram.org. Шаг идемпотентен — setWebhook просто перезаписывает
      # адрес, поэтому повторные деплои безопасны.
      - name: Зарегистрировать вебхуки
        working-directory: partner-bots
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
          BOT_WEBHOOK_SECRET: ${{ secrets.BOT_WEBHOOK_SECRET }}
          BOT_TOKEN_INDIA: ${{ secrets.BOT_TOKEN_INDIA }}
          BOT_TOKEN_AFRICA: ${{ secrets.BOT_TOKEN_AFRICA }}
          BOT_TOKEN_BANGLADESH: ${{ secrets.BOT_TOKEN_BANGLADESH }}
          BOT_TOKEN_WORLDWIDE: ${{ secrets.BOT_TOKEN_WORLDWIDE }}
          BOT_TOKEN_AFRIQUE: ${{ secrets.BOT_TOKEN_AFRIQUE }}
          BOT_TOKEN_UZBEKISTAN: ${{ secrets.BOT_TOKEN_UZBEKISTAN }}
          BOT_TOKEN_RU: ${{ secrets.BOT_TOKEN_RU }}
          BOT_TOKEN_LATAM: ${{ secrets.BOT_TOKEN_LATAM }}
        run: ./set-webhooks.sh

      # Проверяем не свой же ответ, а состояние на стороне Telegram: адрес,
      # который он реально запомнил, и есть ли ошибка доставки. Незарегистри-
      # рованный вебхук выглядит как «бот молчит» и никак иначе себя не
      # проявляет.
      - name: Проверить, что Telegram принял вебхуки
        env:
          WORKER_URL: ${{ steps.deploy.outputs.url }}
          BOT_TOKEN_INDIA: ${{ secrets.BOT_TOKEN_INDIA }}
          BOT_TOKEN_AFRICA: ${{ secrets.BOT_TOKEN_AFRICA }}
          BOT_TOKEN_BANGLADESH: ${{ secrets.BOT_TOKEN_BANGLADESH }}
          BOT_TOKEN_WORLDWIDE: ${{ secrets.BOT_TOKEN_WORLDWIDE }}
          BOT_TOKEN_AFRIQUE: ${{ secrets.BOT_TOKEN_AFRIQUE }}
          BOT_TOKEN_UZBEKISTAN: ${{ secrets.BOT_TOKEN_UZBEKISTAN }}
          BOT_TOKEN_RU: ${{ secrets.BOT_TOKEN_RU }}
          BOT_TOKEN_LATAM: ${{ secrets.BOT_TOKEN_LATAM }}
        run: |
          set -u
          bad=0
          for slug in india africa bangladesh worldwide afrique uzbekistan ru latam; do
            var="BOT_TOKEN_$(echo "$slug" | tr '[:lower:]' '[:upper:]')"
            info=$(curl -sS --max-time 20 "https://api.telegram.org/bot${!var}/getWebhookInfo")
            expected="${WORKER_URL%/}/bot/${slug}"
            if echo "$info" | grep -qF "\"url\":\"${expected}\""; then
              echo "  ok   ${slug} → ${expected}"
            else
              echo "  FAIL ${slug}: Telegram помнит не тот адрес"
              bad=1
            fi
            # Пустая строка ошибки — норма; непустая означает, что доставка
            # уже пробовалась и не вышла.
            err=$(echo "$info" | grep -oE '"last_error_message":"[^"]*"' || true)
            [ -n "$err" ] && echo "       ${err}"
          done
          exit $bad

      - name: Итог
        run: |
          echo "Воркер: ${{ steps.deploy.outputs.url }}"
          echo "Все восемь ботов принимают апдейты. Осталось только наполнить FAQ"
          echo "(таблица bot_faq) — без него бот отдаёт контакт менеджера."
