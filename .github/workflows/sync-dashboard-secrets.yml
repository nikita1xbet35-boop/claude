name: Sync dashboard worker secrets

# Заливает секреты дашбордного воркера (claude) из секретов GitHub.
#
# ── Зачем ───────────────────────────────────────────────────────────────────
# AUTH_FULL_HASH и AUTH_STANDARD_HASH были заведены в панели Cloudflare типом
# Text. Это дважды плохо:
#
#   1. wrangler считает Text-переменные декларативными и удаляет те, которых
#      нет в конфиге, — то есть каждый деплой из GitHub стирал их. Панель при
#      этом продолжала их показывать, и воркер с панелью месяцами говорили
#      разное, оба будучи правы.
#   2. Text показывает значение открытым текстом любому, кто откроет страницу
#      настроек.
#
# `wrangler secret put` кладёт значение в отдельное хранилище секретов: деплой
# его не трогает, в панели оно не отображается. Это и есть правильное место
# для пароля.
#
# ── Что завести в GitHub → Settings → Secrets and variables → Actions ───────
#   AUTH_FULL_HASH        PIN полного доступа
#   AUTH_STANDARD_HASH    PIN обычного доступа
#   SESSION_SECRET        длинная случайная строка (подпись сессионной куки)
#   SUPABASE_JWT_SECRET   Legacy JWT Secret из Supabase (нужен для RLS)
#
# Незаданные пропускаются: воркфлоу не должен затирать то, что уже настроено
# в Cloudflare, только потому что в GitHub этого нет.
#
# ── Почему только по запросу ────────────────────────────────────────────────
# Секреты меняются редко, а каждый запуск создаёт новую версию воркера. Гонять
# это на каждый пуш незачем — запускается вручную или через API.

on:
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Установить wrangler
        run: npm install -g wrangler@3

      # Из корня репозитория: здесь лежит wrangler.jsonc с name = "claude",
      # по нему wrangler и понимает, какому воркеру принадлежит секрет.
      - name: Залить секреты
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          AUTH_FULL_HASH: ${{ secrets.AUTH_FULL_HASH }}
          AUTH_STANDARD_HASH: ${{ secrets.AUTH_STANDARD_HASH }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SUPABASE_JWT_SECRET: ${{ secrets.SUPABASE_JWT_SECRET }}
        run: |
          set -u
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::нет CLOUDFLARE_API_TOKEN в секретах GitHub"; exit 1
          fi
          synced=""; skipped=""
          for name in AUTH_FULL_HASH AUTH_STANDARD_HASH SESSION_SECRET SUPABASE_JWT_SECRET; do
            value="${!name:-}"
            if [ -z "$value" ]; then skipped="$skipped $name"; continue; fi
            # printf, а не echo: echo добавил бы перевод строки в значение, и
            # safeEqual в worker.js перестал бы совпадать по длине. Ровно эта
            # поломка выглядит как «пароль не подходит» и ищется часами.
            printf '%s' "$value" | wrangler secret put "$name" >/dev/null
            synced="$synced $name"
          done
          echo "залиты:$synced"
          [ -n "$skipped" ] && echo "::warning::пропущены (не заданы в GitHub):$skipped"
          exit 0

      - name: Что проверить
        run: |
          echo "Открой дашборд, нажми ⇄ — под полем должно быть 'сейчас: ...'"
          echo "без красной строки про незаданные переменные."
          echo "Или напрямую: https://claude.nikita1xbet35.workers.dev/__role"
