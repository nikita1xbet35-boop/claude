name: Pipeline Health

# Watchdog for the AffiliateOS pipeline. Prints a health snapshot and sends a
# Telegram alert when the system needs attention — reserve of contactable leads
# too low, or the pipeline stalled.
#
# ВАЖНО: этот воркфлоу НЕ краснеет. Раньше здесь было написано «FAILS (red X +
# GitHub notification)», и это неправда: шаг начинается с `set +e`, а после
# ветки с алертом ничего не выходит с ненулевым кодом. Проверено фактами —
# конвейер стоял с 20 августа, а все прогоны за эти тринадцать дней зелёные.
#
# Сигнал есть, но приходит он ТОЛЬКО в Telegram. Зелёная галка здесь ничего не
# доказывает, и полагаться на неё как на признак живого конвейера нельзя.
# Если понадобится красный крест — добавить `exit 1` в ветку с PROBLEMS; пока
# не добавлен сознательно, чтобы не сыпать красным на каждую паузу.
# (probe bump 2026-07-03 #16: DEEP SWEEP — freshness, Groq rotation health, save trend, form codes)
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/livediag.yml'

# Thresholds — tune here.
env:
  MIN_RESERVE: '3'        # alert if fewer than this many contactable leads are waiting
  MIN_NEW_LEADS_1H: '1'   # alert if zero leads were added in the last hour (pipeline stalled)

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - name: Query live DB + evaluate health
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GROQ_KEY_1: ${{ secrets.GROQ_KEY_1 }}
          GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
          GROQ_KEY_3: ${{ secrets.GROQ_KEY_3 }}
        run: |
          set +e
          ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4c3lyc2VyZnVpZ2h3eHV5bWdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NDUwNDgsImV4cCI6MjA5MDUyMTA0OH0.6SgyPJZ_TKeKJoC_E4mIQhd373UMP8-K1VMSZJJacsM"
          # ── Почему здесь -s, а не -sf, и разбор ответа ─────────────────────
          # Было -sf: при любой неудаче curl глотал тело и печатал ПУСТО. А
          # пустой вывод неотличим от «данных нет» — то есть от нормального
          # результата. На этом сгорел целый круг диагностики: добавленный сюда
          # запрос был многострочным, ломал JSON (переводы строк внутри строки
          # JSON недопустимы), API отвечал ошибкой, а в логе была пустота, и
          # выглядело это как «ошибок за 6 часов нет».
          #
          # Успешный ответ этого API — всегда JSON-массив. Всё, что начинается
          # не с '[', разбором не является и печатается как ошибка.
          #
          # ВАЖНО: запрос обязан быть ОДНОСТРОЧНЫМ. Многострочный молча
          # ломается ровно так, как описано выше.
          q() {
            local out
            out=$(curl -s -X POST \
              "https://api.supabase.com/v1/projects/lxsyrserfuighwxuymgb/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"query\":\"$1\"}")
            case "$out" in
              '['*) printf '%s' "$out" ;;
              '')   echo "   ⚠ пустой ответ от Supabase API" ;;
              *)    echo "   ⚠ запрос не выполнился: $(printf '%s' "$out" | head -c 250)" ;;
            esac
          }

          echo "=== SEND_QUEUE BY STATUS ==="
          q "SELECT status, count(*) FROM send_queue GROUP BY status ORDER BY count DESC;"; echo ""

          RESERVE_JSON=$(q "SELECT count(*) AS n FROM leads l WHERE l.contact_email IS NOT NULL AND l.stage IN ('new','ready','researched','followup') AND NOT EXISTS (SELECT 1 FROM email_log e WHERE e.email = l.contact_email);")
          RESERVE=$(echo "$RESERVE_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['n'])" 2>/dev/null || echo 0)
          echo "=== CONTACTABLE RESERVE: $RESERVE ==="

          SENT_JSON=$(q "SELECT count(*) AS n FROM email_log WHERE sent_at >= (now() AT TIME ZONE 'UTC' + interval '3 hours')::date - interval '3 hours';")
          SENT=$(echo "$SENT_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['n'])" 2>/dev/null || echo 0)
          echo "=== SENT TODAY (GMT+3): $SENT ==="

          LEADS_JSON=$(q "SELECT count(*) AS n, count(contact_email) AS e FROM leads WHERE created_at > now() - interval '60 minutes';")
          NEW1H=$(echo "$LEADS_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['n'])" 2>/dev/null || echo 0)
          EMAIL1H=$(echo "$LEADS_JSON" | python3 -c "import sys,json; print(json.load(sys.stdin)[0]['e'])" 2>/dev/null || echo 0)
          echo "=== LEADS LAST 60 MIN: $NEW1H new / $EMAIL1H with email ==="

          echo ""
          echo "=== LAST 8 find-and-queue RUNS ==="
          q "SELECT created_at, message FROM error_log WHERE service='find-and-queue' ORDER BY created_at DESC LIMIT 8;"; echo ""

          echo ""
          echo "=== SENT TODAY BY HOUR (GMT+3) ==="
          q "SELECT to_char(sent_at + interval '3 hours', 'HH24') AS hour_gmt3, count(*) FROM email_log WHERE sent_at >= (now() AT TIME ZONE 'UTC' + interval '3 hours')::date - interval '3 hours' GROUP BY 1 ORDER BY 1;"; echo ""

          echo ""
          echo "=== NEXT 10 PENDING IN SEND_QUEUE ==="
          q "SELECT sq.scheduled_at, sq.retry_count, l.contact_email IS NOT NULL AS has_email FROM send_queue sq LEFT JOIN leads l ON l.id = sq.lead_id WHERE sq.status = 'pending' ORDER BY sq.scheduled_at ASC LIMIT 10;"; echo ""

          echo ""
          echo "=== FAIL/SKIP REASONS (24h) ==="
          q "SELECT status, error, count(*) FROM send_queue WHERE status IN ('failed','skipped') GROUP BY 1,2 ORDER BY 3 DESC LIMIT 12;"; echo ""

          echo ""
          echo "=== 1XBET QUEUE DIAGNOSIS (why slow) ==="
          echo "--- pending: due now vs scheduled in future ---"
          q "SELECT CASE WHEN scheduled_at <= now() THEN 'due_now' ELSE 'future' END AS bucket, count(*) FROM send_queue WHERE status='pending' GROUP BY 1;"; echo ""
          echo "--- pending due-now split by has valid email ---"
          q "SELECT (l.contact_email IS NOT NULL) AS has_email, count(*) FROM send_queue sq LEFT JOIN leads l ON l.id=sq.lead_id WHERE sq.status='pending' AND sq.scheduled_at<=now() GROUP BY 1;"; echo ""
          echo "--- future pending: earliest scheduled_at (how far out is backlog spread) ---"
          q "SELECT min(scheduled_at) AS soonest, max(scheduled_at) AS latest, count(*) FROM send_queue WHERE status='pending' AND scheduled_at>now();"; echo ""
          echo "--- generate-queue cadence last 1h ---"
          q "SELECT created_at, level, left(message,160) AS msg FROM error_log WHERE service='generate-queue' AND created_at > now() - interval '1 hour' ORDER BY created_at DESC LIMIT 12;"; echo ""

          echo ""
          echo "=== LEAD SUPPLY DIAGNOSIS (why not_found backlog) ==="
          echo "--- all leads by contact_email_type ---"
          q "SELECT contact_email_type, count(*) FROM leads GROUP BY 1 ORDER BY 2 DESC;"; echo ""
          echo "--- not_found leads: t.me vs website url ---"
          q "SELECT CASE WHEN url ILIKE '%t.me/%' OR url ILIKE '%telegram.%' THEN 'telegram' WHEN url ILIKE 'http%' THEN 'website' ELSE 'other' END AS kind, count(*) FROM leads WHERE contact_email_type='not_found' GROUP BY 1 ORDER BY 2 DESC;"; echo ""
          echo "--- not_found leads by channel_kind ---"
          q "SELECT channel_kind, count(*) FROM leads WHERE contact_email_type='not_found' GROUP BY 1 ORDER BY 2 DESC;"; echo ""
          echo "--- sample 20 not_found lead URLs ---"
          q "SELECT left(url,70) AS url, brand FROM leads WHERE contact_email_type='not_found' ORDER BY created_at DESC LIMIT 20;"; echo ""
          echo "--- leads WITH email: how was it found (by type) ---"
          q "SELECT contact_email_type, count(*) FROM leads WHERE contact_email IS NOT NULL GROUP BY 1 ORDER BY 2 DESC;"; echo ""
          echo "--- find-and-queue totals last 24h: found vs saved vs contacts ---"
          q "SELECT count(*) AS runs, sum((regexp_match(message,'found=([0-9]+)'))[1]::int) AS found, sum((regexp_match(message,'saved=([0-9]+)'))[1]::int) AS saved, sum((regexp_match(message,'contacts=([0-9]+)'))[1]::int) AS contacts FROM error_log WHERE service='find-and-queue' AND created_at > now() - interval '24 hours';"; echo ""
          echo "--- find-and-queue by SEARCH PAGE last 24h (proves deep-page pagination works) ---"
          q "SELECT (regexp_match(message,'page=([0-9]+)'))[1] AS page, count(*) AS runs, sum((regexp_match(message,'found=([0-9]+)'))[1]::int) AS found, sum((regexp_match(message,'saved=([0-9]+)'))[1]::int) AS saved FROM error_log WHERE service='find-and-queue' AND created_at > now() - interval '24 hours' GROUP BY 1 ORDER BY 1;"; echo ""
          echo "--- find-and-queue runs WITH a city variant last 24h ---"
          q "SELECT count(*) AS city_runs, sum((regexp_match(message,'saved=([0-9]+)'))[1]::int) AS saved FROM error_log WHERE service='find-and-queue' AND message LIKE '%city=%' AND created_at > now() - interval '24 hours';"; echo ""

          echo ""
          echo "=== API USAGE / LIMITS / PAUSE FLAGS ==="
          q "SELECT service, used, limit_value, paused, system_paused FROM api_usage ORDER BY service;"; echo ""

          echo ""
          echo "=== LEADS ADDED TODAY (GMT+3): total / with email ==="
          q "SELECT count(*) AS total, count(contact_email) AS with_email FROM leads WHERE created_at >= (now() AT TIME ZONE 'UTC' + interval '3 hours')::date - interval '3 hours';"; echo ""

          echo ""
          echo "=== SEND_QUEUE ACTIVITY LAST 30 MIN (by status) ==="
          q "SELECT status, left(error,80) AS reason, count(*) FROM send_queue WHERE scheduled_at > now() - interval '30 minutes' OR sent_at > now() - interval '30 minutes' GROUP BY 1,2 ORDER BY 3 DESC LIMIT 15;"; echo ""

          echo ""
          echo "=== LAST 10 process-queue RUNS ==="
          q "SELECT created_at, message FROM error_log WHERE service='process-queue' ORDER BY created_at DESC LIMIT 10;"; echo ""

          echo ""
          echo "=== LAST 6 generate-queue RUNS ==="
          q "SELECT created_at, message FROM error_log WHERE service='generate-queue' ORDER BY created_at DESC LIMIT 6;"; echo ""

          echo ""
          echo "=== LAST 6 extract-contacts RUNS ==="
          q "SELECT created_at, message FROM error_log WHERE service='extract-contacts' ORDER BY created_at DESC LIMIT 6;"; echo ""

          echo ""
          echo "=== EXTRACT-CONTACTS BACKLOG (leads it should pick up) ==="
          q "SELECT count(*) AS matching FROM leads WHERE contact_email IS NULL AND contact_email_type IS NULL AND stage <> 'excluded';"; echo ""
          q "SELECT contact_email_type, count(*) FROM leads WHERE contact_email IS NULL GROUP BY 1 ORDER BY 2 DESC;"; echo ""

          echo ""
          echo "=== PROBE: extract-contacts direct invoke (runs the function live) ==="
          curl -s -m 150 -X POST \
            "https://lxsyrserfuighwxuymgb.supabase.co/functions/v1/extract-contacts" \
            -H "Content-Type: application/json" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4c3lyc2VyZnVpZ2h3eHV5bWdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NDUwNDgsImV4cCI6MjA5MDUyMTA0OH0.6SgyPJZ_TKeKJoC_E4mIQhd373UMP8-K1VMSZJJacsM" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4c3lyc2VyZnVpZ2h3eHV5bWdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NDUwNDgsImV4cCI6MjA5MDUyMTA0OH0.6SgyPJZ_TKeKJoC_E4mIQhd373UMP8-K1VMSZJJacsM" \
            -d '{}' ; echo ""

          echo ""
          echo "=== LUCKYPARI (LP) OUTREACH STATUS ==="
          q "SELECT status, count(*) FROM lp_outreach GROUP BY status ORDER BY count DESC;"; echo ""
          q "SELECT count(*) AS sent_lp FROM email_log WHERE gmail_account IN ('gmail_lp','outlook_lp');"; echo ""
          echo "--- LP skip/fail reasons ---"
          q "SELECT status, left(error,60) AS reason, count(*) FROM lp_outreach WHERE status IN ('skipped','failed') GROUP BY 1,2 ORDER BY 3 DESC LIMIT 12;"; echo ""
          echo "--- LP base overlap with email_log (already-contacted addresses) ---"
          q "SELECT count(*) AS overlap FROM lp_outreach lp WHERE EXISTS (SELECT 1 FROM email_log e WHERE lower(e.email)=lower(lp.email));"; echo ""
          echo "--- LP truly-sendable pending (no email_log dupe) ---"
          q "SELECT count(*) AS sendable FROM lp_outreach lp WHERE lp.status='pending' AND NOT EXISTS (SELECT 1 FROM email_log e WHERE lower(e.email)=lower(lp.email));"; echo ""

          echo ""
          echo "=== PROBE: process-queue-lp direct invoke (runs LP send live) ==="
          curl -s -m 150 -X POST \
            "https://lxsyrserfuighwxuymgb.supabase.co/functions/v1/process-queue-lp" \
            -H "Content-Type: application/json" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4c3lyc2VyZnVpZ2h3eHV5bWdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NDUwNDgsImV4cCI6MjA5MDUyMTA0OH0.6SgyPJZ_TKeKJoC_E4mIQhd373UMP8-K1VMSZJJacsM" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4c3lyc2VyZnVpZ2h3eHV5bWdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NDUwNDgsImV4cCI6MjA5MDUyMTA0OH0.6SgyPJZ_TKeKJoC_E4mIQhd373UMP8-K1VMSZJJacsM" \
            -d '{}' ; echo ""

          echo ""
          echo "--- LP fail reasons AFTER probe (fresh Gmail errors) ---"
          q "SELECT status, left(error,120) AS reason, count(*) FROM lp_outreach WHERE status IN ('skipped','failed') GROUP BY 1,2 ORDER BY 3 DESC LIMIT 12;"; echo ""

          echo ""
          echo "=== LAST 10 process-queue-lp RUNS ==="
          q "SELECT created_at, level, left(message,200) AS msg FROM error_log WHERE service='process-queue-lp' ORDER BY created_at DESC LIMIT 10;"; echo ""

          echo ""
          echo "=== NON-INFO ERRORS LAST 12H ==="
          q "SELECT created_at, service, level, left(message, 200) AS msg FROM error_log WHERE level <> 'info' AND created_at > now() - interval '12 hours' ORDER BY created_at DESC LIMIT 15;"; echo ""

          echo ""
          echo "=== PROBE: find-and-queue direct invoke (runs function live) ==="
          curl -s -m 150 -X POST \
            "https://lxsyrserfuighwxuymgb.supabase.co/functions/v1/find-and-queue" \
            -H "Content-Type: application/json" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4c3lyc2VyZnVpZ2h3eHV5bWdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NDUwNDgsImV4cCI6MjA5MDUyMTA0OH0.6SgyPJZ_TKeKJoC_E4mIQhd373UMP8-K1VMSZJJacsM" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4c3lyc2VyZnVpZ2h3eHV5bWdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NDUwNDgsImV4cCI6MjA5MDUyMTA0OH0.6SgyPJZ_TKeKJoC_E4mIQhd373UMP8-K1VMSZJJacsM" \
            -d '{}' ; echo ""

          echo ""
          echo "=== CRON CADENCE: find-and-queue timestamps last 2h ==="
          q "SELECT created_at FROM error_log WHERE service='find-and-queue' AND created_at > now() - interval '2 hours' ORDER BY created_at DESC;"; echo ""

          echo ""
          echo "=== CRON CADENCE: process-queue timestamps last 1h ==="
          q "SELECT created_at FROM error_log WHERE service='process-queue' AND created_at > now() - interval '1 hour' ORDER BY created_at DESC;"; echo ""

          echo ""
          echo "=== SERPAPI ACCOUNTS (rotation + monthly budget) ==="
          q "SELECT service, used, limit_value, paused, to_char(last_reset_at,'YYYY-MM-DD') AS reset FROM api_usage WHERE service LIKE 'serpapi%' ORDER BY service;"; echo ""
          echo "--- find-and-queue runs that used SerpApi (last 24h) ---"
          q "SELECT created_at, (regexp_match(message,'serp=([0-9]+\\(serpapi_[0-9]+\\))'))[1] AS serp FROM error_log WHERE service='find-and-queue' AND message LIKE '%serp=%' AND created_at > now() - interval '24 hours' ORDER BY created_at DESC LIMIT 10;"; echo ""

          echo ""
          echo "=== SOURCE SPLIT: sends today by source/brand (GMT+3) ==="
          q "SELECT source, brand, count(*) FROM email_log WHERE sent_at >= (now() AT TIME ZONE 'UTC' + interval '3 hours')::date - interval '3 hours' GROUP BY 1,2 ORDER BY 3 DESC;"; echo ""
          echo "--- leads by source (all-time) ---"
          q "SELECT source, count(*) FROM leads GROUP BY 1 ORDER BY 2 DESC;"; echo ""

          echo ""
          echo "=== FORM CHANNEL: leads by form_status ==="
          q "SELECT form_status, count(*) FROM leads GROUP BY 1 ORDER BY 2 DESC;"; echo ""
          echo "--- form submissions TODAY (GMT+3) ---"
          q "SELECT status, count(*) FROM form_submissions WHERE submitted_at >= (now() AT TIME ZONE 'UTC' + interval '3 hours')::date - interval '3 hours' GROUP BY 1;"; echo ""
          echo "--- form_main quota ---"
          q "SELECT service, used, limit_value FROM api_usage WHERE service='form_main';"; echo ""
          echo "--- form_submissions by status ---"
          q "SELECT status, count(*) FROM form_submissions GROUP BY 1;"; echo ""
          echo "--- sample simple-form leads (ready to submit) ---"
          q "SELECT left(url,60) AS url, left(form_url,60) AS form_url FROM leads WHERE form_status='simple' ORDER BY created_at DESC LIMIT 10;"; echo ""
          echo "--- last 8 find-contact-form runs ---"
          q "SELECT created_at, left(message,160) AS msg FROM error_log WHERE service='find-contact-form' ORDER BY created_at DESC LIMIT 8;"; echo ""
          echo "--- last 10 process-form-queue runs ---"
          q "SELECT created_at, level, left(message,180) AS msg FROM error_log WHERE service='process-form-queue' ORDER BY created_at DESC LIMIT 10;"; echo ""

          echo ""
          echo "=== PROBE: find-contact-form direct invoke (detection live) ==="
          curl -s -m 120 -X POST \
            "https://lxsyrserfuighwxuymgb.supabase.co/functions/v1/find-contact-form" \
            -H "Content-Type: application/json" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4c3lyc2VyZnVpZ2h3eHV5bWdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NDUwNDgsImV4cCI6MjA5MDUyMTA0OH0.6SgyPJZ_TKeKJoC_E4mIQhd373UMP8-K1VMSZJJacsM" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4c3lyc2VyZnVpZ2h3eHV5bWdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NDUwNDgsImV4cCI6MjA5MDUyMTA0OH0.6SgyPJZ_TKeKJoC_E4mIQhd373UMP8-K1VMSZJJacsM" \
            -d '{}' ; echo ""

          echo ""
          echo "=== PROBE: process-form-queue direct invoke (shows dry_run flag + reason) ==="
          curl -s -m 60 -X POST \
            "https://lxsyrserfuighwxuymgb.supabase.co/functions/v1/process-form-queue" \
            -H "Content-Type: application/json" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4c3lyc2VyZnVpZ2h3eHV5bWdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NDUwNDgsImV4cCI6MjA5MDUyMTA0OH0.6SgyPJZ_TKeKJoC_E4mIQhd373UMP8-K1VMSZJJacsM" \
            -H "Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4c3lyc2VyZnVpZ2h3eHV5bWdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NDUwNDgsImV4cCI6MjA5MDUyMTA0OH0.6SgyPJZ_TKeKJoC_E4mIQhd373UMP8-K1VMSZJJacsM" \
            -d '{}' ; echo ""

          echo ""
          echo "████████ DEEP SWEEP ████████"

          echo ""
          echo "=== FUNCTION FRESHNESS (last log per service + minutes ago) ==="
          q "SELECT service, max(created_at) AS last_log, round(extract(epoch FROM (now()-max(created_at)))/60)::int AS mins_ago FROM error_log WHERE service IN ('find-and-queue','extract-contacts','generate-queue','process-queue','process-queue-lp','find-contact-form','process-form-queue','check-limits','watchdog-agent') GROUP BY service ORDER BY mins_ago;"; echo ""

          echo ""
          echo "=== GROQ HEALTH (after 3-key rotation) ==="
          echo "--- groq usage counter ---"
          q "SELECT service, used, limit_value FROM api_usage WHERE service='groq';"; echo ""
          echo "--- find-and-queue runs last 1h: analyzed/saved + 429 presence ---"
          q "SELECT count(*) AS runs, sum((regexp_match(message,'analyzed=([0-9]+)'))[1]::int) AS analyzed, sum((regexp_match(message,'saved=([0-9]+)'))[1]::int) AS saved, sum(CASE WHEN message LIKE '%429%' THEN 1 ELSE 0 END) AS runs_with_429 FROM error_log WHERE service='find-and-queue' AND message LIKE 'brand=%' AND created_at > now() - interval '1 hour';"; echo ""
          echo "--- last 12 find-and-queue completed runs (analyzed/saved/groqErr) ---"
          q "SELECT to_char(created_at,'HH24:MI') AS t, (regexp_match(message,'found=([0-9]+)'))[1] AS found, (regexp_match(message,'analyzed=([0-9]+)'))[1] AS analyzed, (regexp_match(message,'saved=([0-9]+)'))[1] AS saved, substring(message from 'groqErr=(.{0,60})') AS groq_err FROM error_log WHERE service='find-and-queue' AND message LIKE 'brand=%' ORDER BY created_at DESC LIMIT 12;"; echo ""

          echo ""
          echo "=== LEAD-SAVE TREND (find-and-queue saved) ==="
          q "SELECT '1h' AS window, sum((regexp_match(message,'saved=([0-9]+)'))[1]::int) AS saved, sum((regexp_match(message,'contacts=([0-9]+)'))[1]::int) AS contacts FROM error_log WHERE service='find-and-queue' AND message LIKE 'brand=%' AND created_at > now() - interval '1 hour' UNION ALL SELECT '6h', sum((regexp_match(message,'saved=([0-9]+)'))[1]::int), sum((regexp_match(message,'contacts=([0-9]+)'))[1]::int) FROM error_log WHERE service='find-and-queue' AND message LIKE 'brand=%' AND created_at > now() - interval '6 hours' UNION ALL SELECT '24h', sum((regexp_match(message,'saved=([0-9]+)'))[1]::int), sum((regexp_match(message,'contacts=([0-9]+)'))[1]::int) FROM error_log WHERE service='find-and-queue' AND message LIKE 'brand=%' AND created_at > now() - interval '24 hours';"; echo ""
          echo "--- leads added by hour (last 6h, GMT+3) ---"
          q "SELECT to_char(created_at + interval '3 hours','HH24') AS hour, count(*) AS total, count(contact_email) AS with_email FROM leads WHERE created_at > now() - interval '6 hours' GROUP BY 1 ORDER BY 1;"; echo ""

          echo ""
          echo "=== FORM CHANNEL health (today, GMT+3) ==="
          q "SELECT status, count(*) FROM form_submissions WHERE submitted_at >= (now() AT TIME ZONE 'UTC' + interval '3 hours')::date - interval '3 hours' GROUP BY 1;"; echo ""
          echo "--- form submit HTTP codes today (from logs) ---"
          q "SELECT (regexp_match(message,'http=([0-9]+)'))[1] AS http, count(*) FROM error_log WHERE service='process-form-queue' AND message LIKE '%http=%' AND created_at >= (now() AT TIME ZONE 'UTC' + interval '3 hours')::date - interval '3 hours' GROUP BY 1 ORDER BY 2 DESC;"; echo ""
          echo "--- find-contact-form yield last 24h (simple vs manual vs no_form) ---"
          q "SELECT sum((regexp_match(message,'simple ([0-9]+)'))[1]::int) AS simple, sum((regexp_match(message,'manual ([0-9]+)'))[1]::int) AS manual, sum((regexp_match(message,'no_form ([0-9]+)'))[1]::int) AS no_form FROM error_log WHERE service='find-contact-form' AND message LIKE 'Checked%' AND created_at > now() - interval '24 hours';"; echo ""

          echo ""
          echo "=== ERROR VOLUME by service (non-info, 24h) ==="
          q "SELECT service, level, count(*) FROM error_log WHERE level <> 'info' AND created_at > now() - interval '24 hours' GROUP BY 1,2 ORDER BY 3 DESC LIMIT 15;"; echo ""

          # Счётчик ошибок говорит, что что-то не так, и молчит о том, ЧТО именно.
          # Сегодня это стоило отдельного круга: поиск шёл, лидов было ноль, а по
          # сводке нельзя было отличить «DuckDuckGo не отдаёт результатов» от
          # «всё отсеял дедуп». Тексты — единственное, что различает эти случаи.
          echo "=== ПОСЛЕДНИЕ ОШИБКИ поискового пути (текст, 6ч) ==="
          q "SELECT to_char(created_at,'MM-DD HH24:MI') AS t, service, level, left(message, 200) AS message FROM error_log WHERE level <> 'info' AND created_at > now() - interval '6 hours' AND service IN ('find-and-queue','DuckDuckGo','funnel','scan-tg-channels','serpapi') ORDER BY created_at DESC LIMIT 12;"; echo ""

          # Последние прогоны поиска целиком: сколько ключей отработало, сколько
          # URL пришло, сколько отсеял дедуп. Именно эта строка отвечает на
          # вопрос «искали и не нашли» против «нашли, но всё уже в базе».
          # Сводка прогона режет notes до 110 символов, а groqErr стоит в самом
          # конце строки — от него виден огрызок «HTTP 400: {"error":{"messag».
          # Сама строка лежит в error_log целиком, но с level='info', поэтому в
          # выборку ошибок выше не попадает. Забираем её отдельно и целиком:
          # различить «модель снята», «слишком длинный запрос» и «неверный
          # формат» можно только по тексту.
          # ── Живая проверка ключей Groq ─────────────────────────────────────
          # Счётчик 429 не отвечает на главный вопрос: сколько ключей ВООБЩЕ
          # рабочих. Три недействительных ключа и один живой дают ту же картину
          # «упёрлись в лимиты», что и четыре живых под нагрузкой, а чинится это
          # противоположно. Бьём по каждому ключу отдельно и печатаем статус —
          # значения ключей не печатаются никогда.
          echo "=== ЖИВАЯ ПРОВЕРКА КЛЮЧЕЙ GROQ ==="
          for n in GROQ_KEY_1 GROQ_KEY_2 GROQ_KEY_3; do
            v="${!n:-}"
            if [ -z "$v" ]; then echo "   $n: не задан"; continue; fi
            hdrs=$(curl -s -D - -o /tmp/gq.json -m 20 https://api.groq.com/openai/v1/chat/completions \
              -H "Authorization: Bearer $v" -H 'Content-Type: application/json' \
              -d '{"model":"openai/gpt-oss-20b","messages":[{"role":"user","content":"ping"}],"max_tokens":1}')
            code=$(printf '%s' "$hdrs" | head -1 | awk '{print $2}')
            rem=$(printf '%s' "$hdrs" | grep -i 'x-ratelimit-remaining-tokens' | tr -d '\r' | cut -d' ' -f2)
            lim=$(printf '%s' "$hdrs" | grep -i 'x-ratelimit-limit-tokens'     | tr -d '\r' | cut -d' ' -f2)
            err=$(head -c 120 /tmp/gq.json | tr -d '\n')
            if [ "$code" = "200" ]; then
              echo "   $n: OK   токенов в минуту ${rem:-?}/${lim:-?}"
            else
              echo "   $n: HTTP ${code:-нет ответа}  ${err}"
            fi
          done
          echo ""

          echo "=== ТЕКСТ ОШИБОК GROQ (последние 6, любой level) ==="
          q "SELECT to_char(created_at,'MM-DD HH24:MI') AS t, substring(message from 'groqErr=(.*)$') AS groq_error FROM error_log WHERE service='find-and-queue' AND message LIKE '%groqErr%' ORDER BY created_at DESC LIMIT 6;"; echo ""

          # Почему generate-queue пишет «added 0 new» при 251 готовом лиде.
          # Резерв в шапке считается по трём условиям, а generate-queue берёт
          # ещё три: exclude_reason, pipeline и таблицу отправленных. Разница
          # между этими наборами и есть ответ, и увидеть её можно только рядом.
          echo "=== КУДА ДЕВАЮТСЯ ЛИДЫ ПО ПУТИ В ОЧЕРЕДЬ ==="
          q "SELECT count(*) AS s1_stage_i_email, count(*) FILTER (WHERE exclude_reason IS NULL) AS s2_ne_excluded, count(*) FILTER (WHERE exclude_reason IS NULL AND (pipeline = 'search' OR pipeline IS NULL)) AS s3_pipeline_ok, count(*) FILTER (WHERE exclude_reason IS NULL AND (pipeline = 'search' OR pipeline IS NULL) AND NOT EXISTS (SELECT 1 FROM email_log e WHERE lower(e.email) = lower(l.contact_email))) AS s4_never_emailed FROM leads l WHERE stage IN ('new','ready','researched','followup') AND contact_email IS NOT NULL AND contact_email <> '';"; echo ""
          # 129 лидов проходят все условия базы, а в очередь попадает ноль.
          # Значит их отсеивают проверки в памяти: строка в send_queue, вид
          # адреса или список отписок. Считаем их теми же условиями в SQL —
          # иначе остаётся гадать, а гадание тут уже дорого обошлось.
          echo "--- 129 прошедших базу: чем отсеиваются дальше ---"
          q "SELECT count(*) AS eligible, count(*) FILTER (WHERE EXISTS (SELECT 1 FROM send_queue sq WHERE sq.lead_id = l.id AND sq.status = 'sent')) AS has_sent_row, count(*) FILTER (WHERE EXISTS (SELECT 1 FROM send_queue sq WHERE sq.lead_id = l.id)) AS has_any_queue_row, count(*) FILTER (WHERE lower(split_part(contact_email,'@',1)) IN ('info','contact','admin','support','sales','office','hello','mail','team','marketing','partners')) AS role_address, count(*) FILTER (WHERE EXISTS (SELECT 1 FROM suppression_list sl WHERE lower(sl.email) = lower(l.contact_email))) AS suppressed FROM leads l WHERE stage IN ('new','ready','researched','followup') AND contact_email IS NOT NULL AND contact_email <> '' AND exclude_reason IS NULL AND (pipeline = 'search' OR pipeline IS NULL) AND NOT EXISTS (SELECT 1 FROM email_log e WHERE lower(e.email) = lower(l.contact_email));"; echo ""

          echo "--- статус проверки адреса у этих 129 ---"
          q "SELECT coalesce(email_status, 'не проверялся') AS email_status, count(*) FROM leads l WHERE stage IN ('new','ready','researched','followup') AND contact_email IS NOT NULL AND contact_email <> '' AND exclude_reason IS NULL AND (pipeline = 'search' OR pipeline IS NULL) AND NOT EXISTS (SELECT 1 FROM email_log e WHERE lower(e.email) = lower(l.contact_email)) GROUP BY 1 ORDER BY 2 DESC;"; echo ""

          echo "--- причины исключения (топ-8) ---"
          q "SELECT coalesce(exclude_reason, 'нет причины') AS reason, count(*) FROM leads WHERE stage IN ('new','ready','researched','followup') AND contact_email IS NOT NULL AND contact_email <> '' GROUP BY 1 ORDER BY 2 DESC LIMIT 8;"; echo ""
          echo "--- по какому пайплайну пришли ---"
          q "SELECT coalesce(pipeline, 'нет метки') AS pipeline, count(*) FROM leads WHERE stage IN ('new','ready','researched','followup') AND contact_email IS NOT NULL AND contact_email <> '' GROUP BY 1 ORDER BY 2 DESC LIMIT 6;"; echo ""

          echo "=== ПОСЛЕДНИЕ ПРОГОНЫ find-and-queue (сводка) ==="
          q "SELECT to_char(started_at,'MM-DD HH24:MI') AS t, keywords_used AS kw, urls_returned AS raw, urls_after_noise AS after_noise, urls_after_dedup AS new_urls, sent_to_llm, llm_ok, llm_429, leads_created, search_errors, left(coalesce(notes,''), 110) AS notes FROM funnel_stats WHERE pipeline = 'search' ORDER BY started_at DESC LIMIT 8;"; echo ""

          echo ""
          echo "████████ PARTNER BASES + YOUTUBE ████████"
          echo ""
          echo "=== PARTNER BASES state ==="
          q "SELECT name, sending_enabled, sent_today, daily_limit, (template_body IS NOT NULL) AS has_tmpl FROM partner_bases ORDER BY name;"; echo ""
          echo "--- 888starz leads by status ---"
          q "SELECT status, count(*) FROM partner_leads WHERE base_name='888starz' GROUP BY 1 ORDER BY 2 DESC;"; echo ""
          echo "--- partner sends today (GMT+3) ---"
          q "SELECT count(*) AS n FROM email_log WHERE source LIKE 'partner:%' AND sent_at >= (now() AT TIME ZONE 'UTC' + interval '3 hours')::date - interval '3 hours';"; echo ""
          echo "--- last 10 partner sends ---"
          q "SELECT to_char(sent_at,'MM-DD HH24:MI') AS t, email, left(subject,40) AS subj FROM email_log WHERE source LIKE 'partner:%' ORDER BY sent_at DESC LIMIT 10;"; echo ""
          echo "--- last 10 process-partner-queue runs ---"
          q "SELECT to_char(created_at,'MM-DD HH24:MI') AS t, level, left(message,160) AS msg FROM error_log WHERE service='process-partner-queue' ORDER BY created_at DESC LIMIT 10;"; echo ""
          echo "=== PROBE: process-partner-queue direct invoke ==="
          curl -s -m 60 -X POST "https://lxsyrserfuighwxuymgb.supabase.co/functions/v1/process-partner-queue" \
            -H "Content-Type: application/json" -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" -d '{}' ; echo ""

          echo ""
          echo "=== YOUTUBE base ==="
          q "SELECT count(*) AS total_youtube FROM telegram_channels WHERE partner_type='youtube';"; echo ""
          q "SELECT count(*) AS added_24h FROM telegram_channels WHERE partner_type='youtube' AND created_at > now() - interval '24 hours';"; echo ""
          echo "--- youtube subs distribution ---"
          q "SELECT CASE WHEN subscribers>=1000 THEN '1k+' WHEN subscribers>0 THEN '<1k' ELSE '0/hidden' END AS bucket, count(*) FROM telegram_channels WHERE partner_type='youtube' GROUP BY 1 ORDER BY 2 DESC;"; echo ""
          echo "--- last 12 youtube-search runs ---"
          q "SELECT to_char(created_at,'MM-DD HH24:MI') AS t, level, left(message,180) AS msg FROM error_log WHERE service='youtube-search' ORDER BY created_at DESC LIMIT 12;"; echo ""
          echo "=== PROBE: youtube-search cron invoke (live) ==="
          curl -s -m 120 -X POST "https://lxsyrserfuighwxuymgb.supabase.co/functions/v1/youtube-search" \
            -H "Content-Type: application/json" -H "apikey: $ANON_KEY" -H "Authorization: Bearer $ANON_KEY" -d '{"cron":true}' ; echo ""

          echo "████████ END DEEP SWEEP ████████"

          # ── Health verdict — send Telegram alert, never fail the job ────────
          ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx4c3lyc2VyZnVpZ2h3eHV5bWdiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ5NDUwNDgsImV4cCI6MjA5MDUyMTA0OH0.6SgyPJZ_TKeKJoC_E4mIQhd373UMP8-K1VMSZJJacsM"
          PROBLEMS=""
          if [ "$RESERVE" -lt "$MIN_RESERVE" ]; then
            PROBLEMS="${PROBLEMS}⚠️ Контактный резерв: ${RESERVE} (мин. ${MIN_RESERVE})\n"
          fi
          if [ "$NEW1H" -lt "$MIN_NEW_LEADS_1H" ]; then
            PROBLEMS="${PROBLEMS}⚠️ Новых лидов за час: ${NEW1H} — поиск встал\n"
          fi

          if [ -n "$PROBLEMS" ]; then
            MSG="🔴 <b>AffiliateOS Pipeline</b>\n\n${PROBLEMS}\nРезерв: ${RESERVE} | Лидов за час: ${NEW1H} | Отправлено: ${SENT}"
            curl -s -m 15 -X POST \
              "https://lxsyrserfuighwxuymgb.supabase.co/functions/v1/send-alert" \
              -H "Content-Type: application/json" \
              -H "apikey: $ANON_KEY" \
              -H "Authorization: Bearer $ANON_KEY" \
              -d "{\"level\":\"warning\",\"service\":\"pipeline-health\",\"message\":\"reserve=${RESERVE} new_leads_1h=${NEW1H} sent=${SENT}\",\"custom_text\":\"${MSG}\"}" || true
            echo "⚠️ Alert sent to Telegram — reserve=${RESERVE}, new_leads_1h=${NEW1H}, sent_today=${SENT}"
          else
            echo "✅ Healthy — reserve=${RESERVE}, new_leads_1h=${NEW1H}, sent_today=${SENT}"
          fi
