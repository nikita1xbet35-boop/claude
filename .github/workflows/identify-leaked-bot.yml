name: Чей токен утёк (одноразовый)

# ВРЕМЕННЫЙ воркфлоу. Удалить сразу после того, как он отработает один раз.
#
# Зачем он нужен
#
# В telegram-bot/DEPLOY.md лежал токен бота открытым текстом. Чтобы решить, что
# с ним делать, нужно знать, ЧЕЙ он: у Ника два бота, и действия
# противоположные —
#
#   рабочий @affiliate_os_nikitos_bot → /revoke, бот остаётся жить
#   неиспользуемый второй бот         → /deletebot, бот удаляется целиком
#
# Перепутать нельзя: /deletebot по рабочему боту уничтожает его безвозвратно
# вместе с username. Поэтому не гадаем по косвенным признакам, а спрашиваем сам
# Telegram методом getMe.
#
# Почему воркфлоу, а не просто curl. Окружение, в котором готовился этот
# коммит, не имеет сетевого доступа к api.telegram.org — CONNECT отбивается
# политикой с 403. У раннера GitHub доступ есть; это единственная причина, по
# которой шаг оформлен воркфлоу, а не одной строкой в терминале.
#
# Токен берётся ИЗ ИСТОРИИ КОММИТОВ, а не из рабочего дерева: тем же коммитом
# он из документации вычищен. В истории он остаётся — это ровно та проблема,
# ради которой всё и делается.
#
# Печатается ТОЛЬКО username бота. Сам токен не печатается никогда и не
# передаётся никуда, кроме api.telegram.org.

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/identify-leaked-bot.yml'

jobs:
  identify:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — нужна вся история, токен живёт в старых коммитах.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Спросить Telegram, чей это бот
        run: |
          set -u

          # Ищем по всей истории все токены телеграм-ботов. Их должен быть
          # ровно один; если появится больше — значит утекло больше, чем мы
          # думали, и это само по себе важная новость.
          mapfile -t tokens < <(
            git log --all -p --no-color 2>/dev/null \
              | grep -aoE '\b[0-9]{8,10}:AA[A-Za-z0-9_-]{30,}' \
              | sort -u
          )

          if [ "${#tokens[@]}" -eq 0 ]; then
            echo "::error::в истории не нашлось ни одного токена — проверить нечего"
            exit 1
          fi
          echo "токенов в истории: ${#tokens[@]}"
          echo

          for t in "${tokens[@]}"; do
            # Печатаем только id бота — часть до двоеточия. Она не секрет:
            # это публичный числовой идентификатор, по нему нельзя ничего
            # сделать. Секретная часть после двоеточия не печатается.
            id="${t%%:*}"
            echo "── бот id ${id} ──"

            resp=$(curl -sS --max-time 20 "https://api.telegram.org/bot${t}/getMe" || true)

            # Ответ не печатаем целиком: в поле description Telegram иногда
            # возвращает переданный токен обратно.
            if printf '%s' "$resp" | grep -q '"ok":true'; then
              user=$(printf '%s' "$resp" | grep -oE '"username":"[^"]*"' | cut -d'"' -f4)
              name=$(printf '%s' "$resp" | grep -oE '"first_name":"[^"]*"' | cut -d'"' -f4)
              echo "   ЖИВОЙ  @${user:-?}  (${name:-без имени})"
              echo "   → токен действует прямо сейчас, требуется действие в @BotFather"
            elif printf '%s' "$resp" | grep -q '"error_code":401'; then
              echo "   МЁРТВЫЙ — 401 Unauthorized"
              echo "   → токен уже отозван или бот удалён, действий не требуется"
            else
              code=$(printf '%s' "$resp" | grep -oE '"error_code":[0-9]+' | cut -d: -f2)
              echo "   НЕЯСНО — Telegram ответил кодом ${code:-?}"
            fi
            echo
          done

          echo "Что делать дальше:"
          echo "  @affiliate_os_nikitos_bot  → /revoke в @BotFather, бот остаётся"
          echo "  любой другой username      → /deletebot, бот больше не нужен"
