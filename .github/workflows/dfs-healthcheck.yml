name: DataForSEO healthcheck

# Manual, read-only verification that the DataForSEO module is actually alive:
# schema applied, functions deployed and reachable, API credentials valid,
# and the pipeline's own stages reporting in.
#
# Exists because the module cannot be verified from a development sandbox — the
# network policy there blocks both supabase.co and api.dataforseo.com, so
# "deployed successfully" was previously the last thing anyone could confirm.
# A runner has open egress, so this closes that gap.
#
# Spends nothing: estimate_only only calls /v3/appendix/user_data, which is free.

# Runs on demand, and on any push touching this file — same convention as
# tg-diag.yml, so merging it is itself the first run.
on:
  workflow_dispatch:
    inputs:
      harvest:
        description: 'Run a real harvest after the checks (SPENDS MONEY)'
        required: false
        default: 'none'
        type: choice
        options: [none, intersect, both]
      budget:
        description: 'Hard budget ceiling for that run, USD'
        required: false
        default: '0.35'
  push:
    branches: [main]
    paths:
      - '.github/workflows/dfs-healthcheck.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check schema, functions and DataForSEO credentials
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -uo pipefail
          PROJECT=lxsyrserfuighwxuymgb
          API="https://api.supabase.com/v1/projects/$PROJECT/database/query"

          q() {  # $1 = SQL -> prints JSON result
            python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$1" > /tmp/q.json
            curl -s -X POST "$API" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" --data-binary @/tmp/q.json
          }

          echo "── 1. migrations recorded ──────────────────────────────────"
          q "SELECT name FROM public.schema_migrations WHERE name LIKE '0%' ORDER BY name;"
          echo; echo

          echo "── 1b. cron schedule (is anything actually automatic?) ─────"
          # The crons live in the database, not in this repository, so this is
          # the only place their real state is visible. A pipeline whose cron is
          # missing looks identical to one that simply found nothing.
          q "SELECT jobname, schedule, active FROM cron.job ORDER BY jobname;"
          echo; echo
          echo "── 1b-ii. what the auto-* jobs ACTUALLY call ────────────────"
          # These ran daily at ~20:00 UTC and matched none of the LIKE patterns
          # migration 030 searched for, which means the real 3-9 minute pipeline
          # cadence (find-and-queue, dfs-qualify, recover-contacts — all visibly
          # ticking in error_log) is not driven by any per-function cron.job row.
          # Reading the actual command text is the only way to find out what
          # DOES drive it — a wrapper function, pg_net with a different target,
          # or something outside pg_cron entirely.
          q "SELECT jobname, command FROM cron.job ORDER BY jobname LIMIT 3;"
          echo; echo
          echo "── 1b-iii. all cron-related extensions + schemas ────────────"
          q "SELECT extname, extversion FROM pg_extension WHERE extname LIKE '%cron%' OR extname LIKE '%net%' OR extname LIKE '%http%';"
          echo; echo
          q "SELECT schemaname, tablename FROM pg_tables WHERE schemaname IN ('cron','net','supabase_functions','pgsodium') ORDER BY 1,2;"
          echo; echo
          echo "── 1c. brand pipeline state ────────────────────────────────"
          q "SELECT (SELECT count(*) FROM public.brand_targets WHERE active) AS targets, (SELECT count(*) FROM public.brand_keywords WHERE active) AS keywords, (SELECT count(*) FROM public.brand_keywords WHERE active AND last_run_at IS NULL) AS never_run, (SELECT count(*) FROM public.official_domains) AS blocked, (SELECT count(*) FROM public.leads WHERE pipeline='brand') AS brand_leads;"
          echo; echo
          q "SELECT service, level, left(message,300) AS message, created_at FROM public.error_log WHERE service LIKE 'brand-%' ORDER BY created_at DESC LIMIT 6;"
          echo; echo
          echo "── 1d. find-and-queue: is it searching or throttling itself? ─"
          # The question this answers: of the runs that fire, how many actually
          # search? A run that only logs "started" was skipped by the DDG
          # backoff. Ninety minutes of these logs is what exposed the pipeline
          # freezing itself on layer B/C queries that were working fine.
          q "SELECT left(message,200) AS message, created_at FROM public.error_log WHERE service='find-and-queue' ORDER BY created_at DESC LIMIT 15;"
          echo; echo
          echo "── 1e. DDG health decisions (throttled = frozen 45 min) ─────"
          q "SELECT requests, results_total, empty_results, avg_results, throttled, window_start FROM public.source_health WHERE source='ddg' ORDER BY window_start DESC LIMIT 10;"
          echo; echo

          echo "── 1f. ALL PIPELINES: are they producing? ──────────────────"
          # One place to see whether each of the three lead sources is alive,
          # because "0 leads" looks identical whether the searcher is broken,
          # the qualifier is broken, or the source genuinely found nothing.
          q "SELECT pipeline, count(*) AS leads, count(contact_email) AS with_email, count(*) FILTER (WHERE created_at > now() - interval '24 hours') AS last_24h FROM public.leads GROUP BY pipeline ORDER BY 2 DESC;"
          echo; echo
          echo "--- send queues per pipeline ---"
          q "SELECT pipeline, status, count(*) FROM public.send_queue GROUP BY 1,2 ORDER BY 1,3 DESC;"
          echo; echo
          echo "--- telegram pipeline ---"
          q "SELECT (SELECT count(*) FROM public.tg_outreach_channels) AS channels, (SELECT count(*) FROM public.tg_outreach_channels WHERE owner_contact IS NOT NULL) AS with_contact, (SELECT count(*) FROM public.tg_outreach_channels WHERE found_at > now() - interval '24 hours') AS last_24h, (SELECT count(*) FROM public.tg_search_queries WHERE active) AS queries, (SELECT count(*) FROM public.tg_outreach_log) AS sent_cards;"
          echo; echo
          q "SELECT status, count(*) FROM public.tg_outreach_channels GROUP BY 1 ORDER BY 2 DESC;"
          echo; echo
          q "SELECT service, level, left(message,220) AS message, created_at FROM public.error_log WHERE service IN ('scan-tg-channels','send-tg-leads','extract-tg-contact','draft-tg-message') ORDER BY created_at DESC LIMIT 6;"
          echo; echo

          echo "── 1g. BRAND SENDING (just unpaused) ───────────────────────"
          q "SELECT (SELECT count(*) FROM public.leads WHERE pipeline='brand') AS leads, (SELECT count(*) FROM public.leads WHERE pipeline='brand' AND contact_email IS NOT NULL) AS with_email, (SELECT count(*) FROM public.leads WHERE pipeline='brand' AND contact_email IS NOT NULL AND exclude_reason IS NULL) AS sendable, (SELECT count(*) FROM public.leads WHERE pipeline='brand' AND exclude_reason IS NOT NULL) AS excluded;"
          echo; echo
          q "SELECT coalesce(reject_reason,'—') AS reason, count(*) FROM public.leads WHERE pipeline='brand' AND reject_reason IS NOT NULL GROUP BY 1 ORDER BY 2 DESC;"
          echo; echo
          q "SELECT service, level, left(message,240) AS message, created_at FROM public.error_log WHERE service IN ('generate-queue-brand','process-queue') ORDER BY created_at DESC LIMIT 8;"
          echo; echo
          echo "--- what actually went out on the brand pipeline ---"
          q "SELECT l.domain_normalized, l.geo, left(l.found_keyword,40) AS keyword, e.subject, e.sent_at FROM public.email_log e JOIN public.leads l ON l.id = e.lead_id WHERE e.pipeline='brand' ORDER BY e.sent_at DESC LIMIT 10;"
          echo; echo

          echo "╔═══════════════ 2-DAY REPORT ═══════════════╗"
          echo "── R1. leads found per pipeline per day ─────────────────────"
          q "SELECT date_trunc('day', created_at)::date AS day, pipeline, count(*) AS leads, count(contact_email) AS with_email FROM public.leads WHERE created_at > now() - interval '3 days' GROUP BY 1,2 ORDER BY 1 DESC, 3 DESC;"
          echo; echo
          echo "── R2. emails actually sent per day per pipeline ────────────"
          q "SELECT date_trunc('day', sent_at)::date AS day, coalesce(pipeline,'search') AS pipeline, count(*) AS sent FROM public.email_log WHERE sent_at > now() - interval '3 days' GROUP BY 1,2 ORDER BY 1 DESC, 3 DESC;"
          echo; echo
          echo "── R3. sends by hour (did 24/7 actually take effect?) ───────"
          q "SELECT to_char(sent_at + interval '3 hours','YYYY-MM-DD HH24') AS hour_gmt3, count(*) FROM public.email_log WHERE sent_at > now() - interval '30 hours' GROUP BY 1 ORDER BY 1 DESC LIMIT 24;"
          echo; echo
          echo "── R4. replies / interest ──────────────────────────────────"
          q "SELECT stage, count(*) FROM public.leads WHERE stage NOT IN ('new','excluded') GROUP BY 1 ORDER BY 2 DESC LIMIT 12;"
          echo; echo
          echo "── R5. search pipeline: real runs vs self-throttled (48h) ───"
          q "SELECT count(*) FILTER (WHERE message = 'started') AS started, count(*) FILTER (WHERE message LIKE '%found=%') AS searched, count(*) FILTER (WHERE message LIKE '%DEAD%' OR message LIKE '%starving%') AS froze FROM public.error_log WHERE service='find-and-queue' AND created_at > now() - interval '48 hours';"
          echo; echo
          q "SELECT count(*) AS ddg_windows, count(*) FILTER (WHERE throttled) AS throttled, round(avg(avg_results),2) AS avg_results FROM public.source_health WHERE source='ddg' AND window_start > now() - interval '48 hours';"
          echo; echo
          echo "── R6. brand pipeline end to end ───────────────────────────"
          q "SELECT (SELECT count(*) FROM public.brand_keywords WHERE active AND last_run_at IS NOT NULL) AS kw_done, (SELECT count(*) FROM public.brand_keywords WHERE active) AS kw_total, (SELECT count(*) FROM public.leads WHERE pipeline='brand') AS leads, (SELECT count(*) FROM public.leads WHERE pipeline='brand' AND contact_email IS NOT NULL) AS with_email, (SELECT count(*) FROM public.leads WHERE pipeline='brand' AND contact_email IS NOT NULL AND exclude_reason IS NULL) AS sendable, (SELECT count(*) FROM public.leads WHERE pipeline='brand' AND enriched_at IS NOT NULL) AS enriched, (SELECT count(*) FROM public.send_queue WHERE pipeline='brand') AS queued, (SELECT count(*) FROM public.email_log WHERE pipeline='brand') AS sent;"
          echo; echo
          q "SELECT coalesce(reject_reason,'(none)') AS reason, count(*) FROM public.leads WHERE pipeline='brand' GROUP BY 1 ORDER BY 2 DESC;"
          echo; echo
          echo "── R7. brand emails that went out (real subjects) ───────────"
          q "SELECT l.domain_normalized, l.geo, left(l.found_keyword,32) AS keyword, left(e.subject,52) AS subject, e.sent_at FROM public.email_log e JOIN public.leads l ON l.id=e.lead_id WHERE e.pipeline='brand' ORDER BY e.sent_at DESC LIMIT 12;"
          echo; echo
          echo "── R8. stage functions: last line each ─────────────────────"
          q "SELECT DISTINCT ON (service) service, left(message,190) AS message, created_at FROM public.error_log WHERE created_at > now() - interval '3 hours' AND service IN ('find-and-queue','brand-search','brand-enrich','generate-queue-brand','generate-queue','process-queue','dfs-qualify','scan-tg-channels','send-tg-leads','extract-contacts','score-leads') ORDER BY service, created_at DESC;"
          echo; echo
          echo "── R9. errors worth seeing (48h, non-info) ─────────────────"
          q "SELECT service, level, left(message,150) AS message, count(*) AS n, max(created_at) AS last FROM public.error_log WHERE level <> 'info' AND created_at > now() - interval '48 hours' GROUP BY 1,2,3 ORDER BY n DESC LIMIT 12;"
          echo; echo
          echo "── V9. funnel telemetry (block A) ──────────────────────────"
          q "SELECT to_regclass('public.funnel_stats') IS NOT NULL AS funnel_table, to_regclass('public.funnel_24h') IS NOT NULL AS funnel_view, (SELECT count(*) FROM information_schema.columns WHERE table_name='keywords' AND column_name='new_urls') AS keywords_new_urls_col;"
          echo; echo
          q "SELECT * FROM public.funnel_24h ORDER BY pipeline;"
          echo; echo
          q "SELECT pipeline, to_char(started_at,'DD HH24:MI') AS t, keywords_used AS kw, urls_returned AS urls, urls_after_noise AS noise_ok, urls_after_dedup AS new_urls, sent_to_llm AS llm_in, llm_ok, llm_429, contacts_found AS contacts, leads_created AS leads, budget_exhausted AS no_time, left(notes,60) AS notes FROM public.funnel_stats ORDER BY started_at DESC LIMIT 15;"
          echo; echo
          echo "── V9-G4. top errors, 7 days (block G.4) ───────────────────"
          q "SELECT service, level, left(message,110) AS message, count(*) AS n, max(created_at) AS last FROM public.error_log WHERE level <> 'info' AND created_at > now() - interval '7 days' GROUP BY 1,2,3 ORDER BY n DESC LIMIT 15;"
          echo; echo
          echo "── V9-C1. keyword pool burn-out (block C) ──────────────────"
          q "SELECT count(*) FILTER (WHERE active) AS active_kw, count(*) FILTER (WHERE NOT active) AS archived_kw, count(*) FILTER (WHERE active AND last_run_at IS NULL) AS never_run, count(*) FILTER (WHERE active AND runs >= 15 AND leads_created = 0) AS candidates_for_archive, round(avg(NULLIF(runs,0)),1) AS avg_runs FROM public.keywords;"
          echo; echo
          q "SELECT preset, count(*) FILTER (WHERE active) AS active_kw, sum(runs) AS runs, sum(urls_found) AS urls, sum(leads_created) AS leads FROM public.keywords GROUP BY preset ORDER BY leads DESC LIMIT 12;"
          echo; echo
          echo "── T1. is anything running AT ALL right now ────────────────"
          q "SELECT service, count(*) AS lines_24h, count(*) FILTER (WHERE level <> 'info') AS bad, max(created_at) AS last_seen FROM public.error_log WHERE created_at > now() - interval '24 hours' GROUP BY 1 ORDER BY last_seen DESC;"
          echo; echo
          echo "── T1b. did the model fallback take, and which model answered ─"
          q "SELECT service, left(message,200) AS message, created_at FROM public.error_log WHERE created_at > now() - interval '2 hours' AND (message LIKE '%model%' OR message LIKE '%analyzed=%') ORDER BY created_at DESC LIMIT 12;"
          echo; echo
          echo "── T2. last 15 lines of anything, newest first ──────────────"
          q "SELECT service, level, left(message,150) AS message, created_at FROM public.error_log ORDER BY created_at DESC LIMIT 15;"
          echo; echo
          echo "── T3. queue + leads state right now ───────────────────────"
          q "SELECT (SELECT count(*) FROM public.send_queue WHERE status='pending') AS pending_all, (SELECT count(*) FROM public.send_queue WHERE status='pending' AND pipeline='brand') AS pending_brand, (SELECT count(*) FROM public.send_queue WHERE status='pending' AND scheduled_at < now()) AS overdue, (SELECT count(*) FROM public.leads WHERE created_at > now() - interval '24 hours') AS leads_24h, (SELECT count(*) FROM public.email_log WHERE sent_at > now() - interval '24 hours') AS sent_24h;"
          echo; echo
          echo "── T4. did migration 033 flag more than it should ──────────"
          q "SELECT count(*) FILTER (WHERE suspected_official) AS flagged, count(*) FILTER (WHERE exclude_reason IS NOT NULL) AS excluded, count(*) AS total FROM public.leads WHERE pipeline='brand';"
          echo; echo
          echo "── R11. brand queue: why so few eligible ───────────────────"
          q "SELECT count(*) AS not_yet_mailed, count(*) FILTER (WHERE stage NOT IN ('new','ready','researched','followup')) AS wrong_stage, count(*) FILTER (WHERE suspected_official) AS flagged_official, count(*) FILTER (WHERE email_status IN ('invalid','disposable')) AS bad_status, count(*) FILTER (WHERE contact_email IN (SELECT email FROM public.email_log)) AS addr_already_mailed, count(*) FILTER (WHERE contact_email IN (SELECT email FROM public.suppression_list)) AS suppressed FROM public.leads WHERE pipeline='brand' AND contact_email IS NOT NULL AND contact_email <> '' AND exclude_reason IS NULL AND id NOT IN (SELECT lead_id FROM public.email_log WHERE lead_id IS NOT NULL);"
          echo; echo
          q "SELECT coalesce(stage,'(null)') AS stage, count(*) FROM public.leads WHERE pipeline='brand' GROUP BY 1 ORDER BY 2 DESC;"
          echo; echo
          echo "── R10. telegram ───────────────────────────────────────────"
          q "SELECT (SELECT count(*) FROM public.tg_outreach_channels) AS channels, (SELECT count(*) FROM public.tg_outreach_channels WHERE found_at > now() - interval '48 hours') AS new_48h, (SELECT count(*) FROM public.tg_outreach_channels WHERE owner_contact IS NOT NULL) AS with_contact, (SELECT count(*) FROM public.tg_outreach_log) AS cards_sent;"
          echo; echo
          echo "╚═════════════ END 2-DAY REPORT ═════════════╝"
          echo

          echo "── 2. module tables present ────────────────────────────────"
          q "SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('dfs_domains','dfs_competitors','dfs_usage','owner_clusters','source_health','pipeline_limits') ORDER BY table_name;"
          echo; echo

          echo "── 3. seed + limits ────────────────────────────────────────"
          q "SELECT (SELECT count(*) FROM public.dfs_competitors WHERE active) AS competitors, (SELECT count(*) FROM public.keywords WHERE layer='A' AND active) AS layer_a_keys, (SELECT count(*) FROM public.keywords WHERE layer IN ('B','C') AND source_pref='dataforseo') AS dfs_routed_keys;"
          echo; echo
          q "SELECT pipeline, daily_limit, paused FROM public.pipeline_limits ORDER BY pipeline;"
          echo; echo

          echo "── 4. pipeline state ───────────────────────────────────────"
          q "SELECT status, count(*) FROM public.dfs_domains GROUP BY status ORDER BY status;"
          echo; echo
          # Where the harvested domains actually went. A funnel that ends in zero
          # leads is either a bad source or one over-tight filter, and only this
          # breakdown tells the two apart.
          q "SELECT coalesce(reject_reason,'—') AS reason, count(*) FROM public.dfs_domains WHERE status='rejected' GROUP BY 1 ORDER BY 2 DESC;"
          echo; echo
          q "SELECT coalesce(sum(cost_usd),0) AS spent_total, count(*) AS calls FROM public.dfs_usage;"
          echo; echo

          echo "── 5. recent stage logs (are the crons running?) ───────────"
          # 400, not 150: an llm_error snippet ("groq key#0 HTTP 413: {...")
          # was getting cut off mid-JSON, right where the actual reason lives.
          q "SELECT service, level, left(message,400) AS message, created_at FROM public.error_log WHERE service LIKE 'dfs-%' OR service='recover-contacts' OR service='generate-queue-dfs' ORDER BY created_at DESC LIMIT 12;"
          echo; echo

          echo "── 6. functions reachable + DataForSEO credentials ─────────"
          # estimate_only is free: it only reads the account balance.
          # The anon key is the same public key the site ships with, read straight
          # out of index.html rather than duplicated into a secret.
          ANON=$(grep -oE "const SUPABASE_KEY  = '[^']+'" index.html | head -1 | sed "s/.*'\(.*\)'/\1/")
          if [ -z "$ANON" ]; then echo "::error::could not read anon key from index.html"; exit 1; fi
          for fn in dfs-harvest dfs-qualify dfs-enrich generate-queue-dfs recover-contacts; do
            printf '%-20s ' "$fn"
            if [ "$fn" = "dfs-harvest" ]; then
              BODY='{"estimate_only":true,"rows_per_call":1000}'
            else
              BODY='{}'
            fi
            code=$(curl -s -o /tmp/fn.txt -w '%{http_code}' -m 120 -X POST \
              "https://$PROJECT.supabase.co/functions/v1/$fn" \
              -H "Content-Type: application/json" \
              -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
              -d "$BODY")
            echo "HTTP $code"
            head -c 500 /tmp/fn.txt; echo; echo
          done

          # ── 7. optional real harvest ──────────────────────────────────────
          # Only on an explicit dispatch. Defaults to 'none', so neither a push
          # nor a plain dispatch can spend anything by accident.
          # A push-triggered run has no dispatch inputs, and this repo's CI token
          # cannot dispatch with inputs at all. So a push run reads these two
          # constants instead — set PUSH_HARVEST to 'intersect' in a commit to
          # fire exactly one harvest on merge, then set it straight back to
          # 'none'. Leaving it armed would spend money on every unrelated edit to
          # this file, so treat flipping it as a one-shot.
          PUSH_HARVEST=none
          PUSH_BUDGET=0.15
          PUSH_ROWS=100

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            HARVEST="${{ github.event.inputs.harvest || 'none' }}"
            BUDGET="${{ github.event.inputs.budget || '0.35' }}"
          else
            HARVEST="$PUSH_HARVEST"
            BUDGET="$PUSH_BUDGET"
          fi
          if [ "$HARVEST" = "none" ]; then
            echo "── 7. harvest: skipped (dispatch with harvest=intersect to run one) ──"
          else
            echo "── 7. HARVEST mode=$HARVEST budget=\$$BUDGET ───────────────"
            curl -s -m 300 -X POST \
              "https://$PROJECT.supabase.co/functions/v1/dfs-harvest" \
              -H "Content-Type: application/json" \
              -H "apikey: $ANON" -H "Authorization: Bearer $ANON" \
              -d "{\"mode\":\"$HARVEST\",\"budget_usd\":$BUDGET,\"rows_per_call\":${PUSH_ROWS:-1000}}" \
              | head -c 2000
            echo; echo
          fi

          # Sections 8/9/9b are free SQL reads — they used to sit behind an
          # `exit 0` that only ran when a paid harvest fired, which silently
          # skipped every quality check on every harvest=none (i.e. free) run.
          # A whole "verify the sample" cycle was wasted rediscovering this: the
          # push completed, cost nothing, and reported nothing because the
          # script had already exited three lines above section 8.
          echo "── 8. what actually landed ─────────────────────────────────"
          q "SELECT status, count(*) FROM public.dfs_domains GROUP BY status ORDER BY status;"
          echo; echo
          q "SELECT coalesce(sum(cost_usd),0) AS spent, count(*) AS calls FROM public.dfs_usage;"
          echo; echo

          echo "── 9. sample — highest intersect_count first (v7 backlinks path) ──"
          # The quality check the whole pilot exists for: are these real affiliate
          # sites, or is the link graph mostly noise? Judge this by eye before
          # putting any more money in.
          q "SELECT domain, intersect_count, dfs_rank, spam_score, array_to_string(competitors_list,'|') AS books FROM public.dfs_domains ORDER BY intersect_count DESC, dfs_rank DESC NULLS LAST LIMIT 40;"
          echo; echo

          echo "── 9b. sample — highest ETV first (v7.1 serp_competitors path) ─"
          # The v7.1 sample: serp_competitors and competitors_domain rows have
          # intersect_count=0 by construction (there is no link graph involved),
          # so section 9's ORDER BY hides them entirely. This is where the new
          # method's actual output is judged by eye.
          q "SELECT domain, source, keyword_cluster, round(etv) AS etv, median_position, round(relevance,2) AS relevance FROM public.dfs_domains WHERE source IN ('serp_competitors','competitors_domain') ORDER BY etv DESC NULLS LAST LIMIT 40;"
          echo; echo

          echo "── 9c. ranked_keywords results — qualified domains, highest volume first ─"
          # Step R's actual output: commercial_keywords / total_search_volume /
          # top3_keywords per domain. This is the number the whole rework exists
          # to produce — a domain "ranking for 500 keys" with no volume behind
          # them is worth nothing, so total_search_volume is what is judged here,
          # not any count.
          q "SELECT domain, keyword_cluster, commercial_keywords, total_search_volume, top3_keywords, round(etv) AS etv FROM public.dfs_domains WHERE rank_checked_at IS NOT NULL ORDER BY total_search_volume DESC NULLS LAST LIMIT 40;"
          echo

# ping: two-day system report — no spend
