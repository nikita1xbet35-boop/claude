name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'edge-functions/**'
      # schema changes have to ship too — migration-only pushes used to sit
      # undeployed until an unrelated edge-function edit happened to trigger a run
      - 'supabase/migrations/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # ── Migrations ────────────────────────────────────────────────────────
      # Every .sql in supabase/migrations is applied in filename order, ONCE.
      # Adding a migration means dropping a file in that directory — no workflow
      # edit. Applied names are recorded in schema_migrations, so the big seed
      # files (~680KB across 009/013/014) no longer replay on every deploy, and a
      # seed can't resurrect rows that were deleted afterwards.
      # Payloads go through a file with --data-binary: the largest seed is ~550KB,
      # which blows the argv limit if passed with -d.
      # 000_bootstrap.sql is intentionally re-run every time (it regenerates
      # non-default search presets), so it is excluded from the ledger.
      - name: Apply DB migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -uo pipefail
          API="https://api.supabase.com/v1/projects/lxsyrserfuighwxuymgb/database/query"

          # NB: no curl -f here. -f makes curl exit non-zero but DISCARD the response
          # body, which is exactly the error message we need; a failing migration
          # then reports as a blank line. Capture the status code instead.
          #
          # --max-time: a bare curl here can hang the whole job for the length of
          # the runner's own timeout instead of failing fast — happened live during
          # a Supabase Management API outage, where one call sat "in progress" for
          # 20+ minutes with nothing to retry against.
          #
          # Internal retry: the SAME outage showed clearly flaky (not fully down)
          # behaviour — timeouts and 524s on most calls, but a real request
          # succeeding often enough that a plain re-run of the whole workflow
          # would eventually get further, one file at a time, over many manual
          # retries. Retrying inside a single call gets the same effect without
          # a human re-triggering the job a dozen times.
          post_payload() {
            local attempt
            for attempt in 1 2 3 4 5; do
              code=$(curl -s --max-time 25 -o /tmp/mig_out.txt -w '%{http_code}' -X POST "$API" \
                -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
                -H "Content-Type: application/json" \
                --data-binary @/tmp/mig_payload.json)
              if [ "$code" -ge 200 ] 2>/dev/null && [ "$code" -lt 300 ] 2>/dev/null; then
                return 0
              fi
              echo "  (attempt $attempt: HTTP ${code:-timeout}, retrying...)"
              sleep $((attempt * 3))
            done
            return 1
          }

          run_sql_file() {  # $1 = path to .sql
            python3 -c "import json,sys; print(json.dumps({'query': open(sys.argv[1]).read()}))" "$1" > /tmp/mig_payload.json
            post_payload
          }

          run_sql() {      # $1 = inline SQL
            python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$1" > /tmp/mig_payload.json
            post_payload
          }

          # ledger table
          run_sql "CREATE TABLE IF NOT EXISTS public.schema_migrations (name TEXT PRIMARY KEY, applied_at TIMESTAMPTZ DEFAULT now());" \
            || { echo "::error::could not create schema_migrations"; cat /tmp/mig_out.txt; exit 1; }

          # Historical one-shot migrations that must NEVER be replayed. 001 deletes
          # duplicate leads by domain and rebuilds a UNIQUE constraint; it was applied
          # once through a separate workflow (which is why the old pipeline started at
          # 002), so replaying it would delete rows rather than be a no-op. Record it
          # as applied instead of running it.
          for name in 001_dedup_perf_blacklist.sql; do
            run_sql "INSERT INTO public.schema_migrations (name) VALUES ('$name') ON CONFLICT DO NOTHING;" || true
          done

          run_sql "SELECT name FROM public.schema_migrations;" || { echo "::error::could not read ledger"; exit 1; }
          APPLIED=$(python3 -c "import json;print(' '.join(r['name'] for r in json.load(open('/tmp/mig_out.txt'))))" 2>/dev/null || echo "")
          echo "already applied:${APPLIED:- none}"

          FAILED=""
          for f in $(ls supabase/migrations/*.sql | sort); do
            name=$(basename "$f")
            if [ "$name" != "000_bootstrap.sql" ] && echo " $APPLIED " | grep -q " $name "; then
              echo "· $name (already applied)"
              continue
            fi
            if run_sql_file "$f"; then
              echo "✓ $name"
              if [ "$name" != "000_bootstrap.sql" ]; then
                run_sql "INSERT INTO public.schema_migrations (name) VALUES ('$name') ON CONFLICT DO NOTHING;" || true
              fi
            else
              echo "✗ $name"
              head -c 600 /tmp/mig_out.txt; echo
              FAILED="$FAILED $name"
            fi
          done

          if [ -n "$FAILED" ]; then
            echo "::error::migrations failed:$FAILED"
            exit 1
          fi
          echo "Migrations up to date."

      # ── Edge functions ────────────────────────────────────────────────────
      # Explicit allowlist rather than a glob over edge-functions/*.ts. Everything
      # here deploys with --no-verify-jwt, i.e. publicly callable, so adding a
      # function to the pipeline stays a deliberate act rather than a side effect
      # of dropping a file in the folder.
      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          FUNCTIONS="
            extract-contacts
            generate-queue
            process-queue
            find-and-queue
            send-email
            send-email-outlook
            process-queue-lp
            admin-reset
            find-contact-form
            process-form-queue
            process-partner-queue
            find-youtube
            youtube-search
            find-appstore
            watchdog-agent
            check-limits
            send-alert
            daily-report
            poll-replies
            validate-emails
            run-sequences
            score-leads
            archive-keywords
            scan-tg-channels
            extract-tg-contact
            draft-tg-message
            send-tg-leads
            dfs-harvest
            dfs-qualify
            dfs-enrich
            generate-queue-dfs
            recover-contacts
            brand-search
            brand-enrich
            generate-queue-brand
          "
          for fn in $FUNCTIONS; do
            mkdir -p "supabase/functions/$fn"
            cp "edge-functions/$fn.ts" "supabase/functions/$fn/index.ts"
          done
          for fn in $FUNCTIONS; do
            echo "── deploying $fn"
            supabase functions deploy "$fn" --project-ref lxsyrserfuighwxuymgb --no-verify-jwt
          done

      # Arm the form channel. process-form-queue stays in DRY-RUN until this secret
      # is 'true'. To disable sending again, set it to 'false' here and redeploy.
      - name: Arm form sending (FORM_SENDING_ENABLED)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase secrets set FORM_SENDING_ENABLED=true --project-ref lxsyrserfuighwxuymgb

      # Arm the App Store source (Africa-focus week). find-appstore stays inert until
      # this secret is 'true'. To disable again, set it to 'false' here and redeploy.
      - name: Arm App Store source (APPSTORE_ENABLED)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase secrets set APPSTORE_ENABLED=true --project-ref lxsyrserfuighwxuymgb

      # SerpApi keys: pushed from GitHub Actions secrets into Supabase function
      # secrets (never committed to the repo). Skips cleanly if a secret is absent,
      # so find-and-queue stays DDG-only until the keys are provided.
      - name: Set optional API keys (SerpApi + extra Groq, from GitHub secrets)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SERPAPI_KEY_1: ${{ secrets.SERPAPI_KEY_1 }}
          SERPAPI_KEY_2: ${{ secrets.SERPAPI_KEY_2 }}
          SERPAPI_KEY_3: ${{ secrets.SERPAPI_KEY_3 }}
          GROQ_KEY_2: ${{ secrets.GROQ_KEY_2 }}
          GROQ_KEY_3: ${{ secrets.GROQ_KEY_3 }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          MILLIONVERIFIER_KEY: ${{ secrets.MILLIONVERIFIER_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SERP_DAILY_CAP: ${{ secrets.SERP_DAILY_CAP }}
        run: |
          ARGS=""
          [ -n "$SERPAPI_KEY_1" ] && ARGS="$ARGS SERPAPI_KEY_1=$SERPAPI_KEY_1"
          [ -n "$SERPAPI_KEY_2" ] && ARGS="$ARGS SERPAPI_KEY_2=$SERPAPI_KEY_2"
          [ -n "$SERPAPI_KEY_3" ] && ARGS="$ARGS SERPAPI_KEY_3=$SERPAPI_KEY_3"
          [ -n "$GROQ_KEY_2" ]    && ARGS="$ARGS GROQ_KEY_2=$GROQ_KEY_2"
          [ -n "$GROQ_KEY_3" ]    && ARGS="$ARGS GROQ_KEY_3=$GROQ_KEY_3"
          [ -n "$YOUTUBE_API_KEY" ] && ARGS="$ARGS YOUTUBE_API_KEY=$YOUTUBE_API_KEY"
          # v5: email validation provider + preferred LLM. Both optional —
          # validate-emails falls back to its built-in checker, and the reply
          # classifier falls back to Groq, so absence degrades rather than breaks.
          [ -n "$MILLIONVERIFIER_KEY" ] && ARGS="$ARGS MILLIONVERIFIER_KEY=$MILLIONVERIFIER_KEY"
          [ -n "$ANTHROPIC_API_KEY" ] && ARGS="$ARGS ANTHROPIC_API_KEY=$ANTHROPIC_API_KEY"
          # Daily SerpApi cap in find-and-queue. Default in code is 60/day; set the
          # SERP_DAILY_CAP GitHub secret to (paid monthly quota / days in month) to
          # raise it without a code change.
          [ -n "$SERP_DAILY_CAP" ] && ARGS="$ARGS SERP_DAILY_CAP=$SERP_DAILY_CAP"
          if [ -n "$ARGS" ]; then
            supabase secrets set $ARGS --project-ref lxsyrserfuighwxuymgb && echo "Optional API keys set"
          else
            echo "No optional API-key secrets present — skipping"
          fi

      - name: Reset system state via Supabase Management API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          cat > /tmp/reset.json <<'JSON'
          {"query":"UPDATE public.api_usage SET system_paused = false, paused = false, alert_sent_warning = false, alert_sent_critical = false; UPDATE public.api_usage SET limit_value = 300 WHERE service = 'gmail_main'; UPDATE public.api_usage SET limit_value = 100 WHERE service = 'gmail_lp'; UPDATE public.api_usage SET limit_value = 100 WHERE service = 'form_main'; UPDATE public.send_queue SET gmail_account = 'main' WHERE gmail_account = 'lp'; UPDATE public.send_queue SET status = 'pending', retry_count = 0, error = NULL WHERE status = 'failed'; UPDATE public.api_usage SET limit_value = 100000 WHERE service = 'serpapi'; UPDATE public.api_usage SET limit_value = 1000000 WHERE service = 'jina'; UPDATE public.send_queue SET status = 'pending', error = NULL WHERE error = 'luckypari brand disabled' AND status = 'skipped'; UPDATE public.send_queue SET status = 'pending', retry_count = 0, error = NULL, scheduled_at = now() WHERE status = 'skipped' AND error = 'Conflicting API keys'; UPDATE public.leads SET stage = 'excluded' WHERE contact_email ~* '@(yandex\\.(ru|com)|ya\\.ru|mail\\.ru|vk\\.com|ok\\.ru|rambler\\.ru|avito\\.ru|gosuslugi\\.ru|sberbank\\.ru|tinkoff\\.ru|wildberries\\.ru|ozon\\.ru|2gis\\.ru|rbc\\.ru|rt\\.com|ria\\.ru|tass\\.ru|google\\.com|apple\\.com|microsoft\\.com|samsung\\.com|huawei\\.com|xiaomi\\.com|baidu\\.com|aliexpress\\.com|wordpress\\.com|wix\\.com|shopify\\.com|cloudflare\\.com)$'; UPDATE public.leads SET stage = 'new' WHERE stage = 'excluded' AND contact_email ~* '@(gmail\\.com|googlemail\\.com|outlook\\.com|hotmail\\.com)$' AND NOT EXISTS (SELECT 1 FROM public.email_log e WHERE lower(e.email) = lower(leads.contact_email)); UPDATE public.send_queue sq SET status = 'skipped', error = 'corporate domain (not an affiliate)' FROM public.leads l WHERE sq.lead_id = l.id AND sq.status = 'pending' AND l.stage = 'excluded' AND sq.error IS DISTINCT FROM 'corporate domain (not an affiliate)'; UPDATE public.lp_outreach SET status = 'pending', error = NULL, retry_count = 0, scheduled_at = now() WHERE status = 'failed' OR (status = 'skipped' AND error NOT ILIKE '%bad email%' AND error NOT ILIKE '%already sent by LP%');"}
          JSON
          curl -sf -X POST \
            "https://api.supabase.com/v1/projects/lxsyrserfuighwxuymgb/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/reset.json \
            && echo "System unpaused + counters reset" || echo "Reset call failed (non-fatal)"

      # ── Проверка того, что схема действительно доехала ────────────────────
      # Появился после дня, в котором ДВЕ схемные поломки прожили часы молча:
      # 037 применилась автоматически вопреки комментарию "только вручную" и
      # сделала brand_id NOT NULL на семи таблицах (каждая вставка из любой
      # edge-функции падала), а 038 столько же времени падала на коллизии имён
      # таблиц. Оба раза деплой был "красный", но ЧТО именно сломано в данных
      # приходилось выяснять чтением сырых логов.
      #
      # Шаг не просто печатает — он ВАЛИТ деплой, если brand_id снова стал
      # NOT NULL хоть где-то: это единственное состояние из перечисленных,
      # которое гарантированно ломает прод целиком.
      - name: Verify multibrand schema
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          q() {
            python3 -c "import json,sys; print(json.dumps({'query': sys.argv[1]}))" "$1" > /tmp/v.json
            curl -s -X POST "https://api.supabase.com/v1/projects/lxsyrserfuighwxuymgb/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" --data-binary @/tmp/v.json
          }

          echo "── Таблицы мультибренда ──"
          q "SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('brands','contact_registry','contact_touches','api_keys','system_config','multibrand_keywords','smtp_accounts','brand_keywords') ORDER BY table_name;"
          echo; echo "── brand_id: где ещё NOT NULL (должно быть пусто) ──"
          # После 044 картина обратная: на leads/send_queue/email_log/funnel_stats
          # NOT NULL — это ЦЕЛЬ, а не авария. Ломает прод обратный случай — если
          # ограничение уехало на error_log/api_usage/dfs_domains, которые по
          # смыслу бренду не принадлежат (системные логи, счётчики на сервис,
          # сырая выгрузка до квалификации). Их и проверяем.
          NN=$(q "SELECT table_name FROM information_schema.columns WHERE table_schema='public' AND column_name='brand_id' AND is_nullable='NO' AND table_name IN ('api_usage','error_log','dfs_domains');")
          echo "── brand_id NOT NULL там, где и должен (ожидаем 4) ──"
          q "SELECT table_name FROM information_schema.columns WHERE table_schema='public' AND column_name='brand_id' AND is_nullable='NO' AND table_name IN ('leads','send_queue','email_log','funnel_stats') ORDER BY table_name;"
          echo; echo "── brand_id NOT NULL там, где НЕ должен (должно быть пусто) ──"
          echo "$NN"
          echo; echo "── Функции ──"
          q "SELECT p.proname FROM pg_proc p JOIN pg_namespace n ON n.oid=p.pronamespace WHERE n.nspname='public' AND p.proname LIKE 'fn_%' ORDER BY 1;"
          echo; echo "── Наполнение ──"
          q "SELECT (SELECT count(*) FROM public.brands) AS brands, (SELECT count(*) FROM public.contact_registry) AS registry, (SELECT count(*) FROM public.multibrand_keywords) AS mb_keywords, (SELECT count(*) FROM public.smtp_accounts) AS smtp;"
          echo; echo "── Пауза + признаки активности пайплайна ──"
          q "SELECT (SELECT bool_and(paused) FROM public.pipeline_limits) AS all_paused, (SELECT max(started_at) FROM public.funnel_stats) AS last_run, (SELECT count(*) FROM public.funnel_stats WHERE started_at > now() - interval '30 minutes') AS runs_30min;"

          # Единственная проверка, которая валит деплой: см. комментарий выше.
          if echo "$NN" | grep -q '"table_name"'; then
            echo "::error::brand_id стал NOT NULL на таблице, которая бренду не принадлежит — системные вставки начнут падать"
            exit 1
          fi
          echo "OK: ограничение стоит ровно там, где задумано."
